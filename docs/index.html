<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR Radio</title>

<style>
* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

a {
  text-decoration: none;
  color: inherit;
}
a:active, a:focus {
  outline: none;
}

html {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ===== BASE: MODERN DEEP DARK THEME ===== */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #0c0e14;
  color: #f1f5f9;
}

/* ===== TOP MOBILE AD (320x100) ===== */
.top-ad {
  width: 100%;
  padding: 10px 14px 2px;
  display: flex;
  justify-content: center;
  background: #0c0e14;
}

.top-ad img {
  width: 100%;
  max-width: 340px;
  height: 100px;
  object-fit: cover;
  border-radius: 16px;
  display: block;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* ===== LIVE CRICKET SCORE STRIP ===== */
.cricket-strip-container {
  padding: 8px 14px 2px;
}

.cricket-card {
  background: linear-gradient(145deg, #151821, #10121a);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}

.cricket-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
}

.cs-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.cs-tour {
  color: #38bdf8;
  max-width: 70%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-status-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #10b981;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.5px;
}

.cs-match-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cs-team {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
}

.cs-team.right {
  flex-direction: row-reverse;
  text-align: right;
}

.cs-flag {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  background: #1a1d26;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.cs-team-info {
  display: flex;
  flex-direction: column;
}

.cs-team-name {
  font-size: 13.5px;
  font-weight: 700;
  color: #ffffff;
}

.cs-team-score {
  font-size: 12px;
  font-weight: 600;
  color: #94a3b8;
}

.cs-vs {
  font-size: 11px;
  font-weight: 800;
  color: #475569;
  padding: 0 10px;
}

.cs-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(255, 255, 255, 0.03);
  padding: 7px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.cs-note {
  font-size: 11.5px;
  color: #94a3b8;
  text-align: left;
  line-height: 1.3;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-btn-card {
  font-size: 11px;
  font-weight: 700;
  color: #031326;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  padding: 5px 14px;
  border-radius: 20px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s ease;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(14, 165, 233, 0.35);
}

.cs-btn-card:active {
  transform: scale(0.94);
}

/* ===== LAYOUT ===== */
.container {
  padding: 12px 14px 18px;
}

.section-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .3px;
  margin: 20px 0 12px;
  color: #ffffff;
}

/* ===== REDESIGNED MODERN QUICK BUTTONS ===== */
.quick-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.quick-buttons a {
  flex: 1;
  min-width: 0;
  text-decoration: none;
}

.qbtn {
  padding: 14px 8px 12px;
  border-radius: 18px;
  background: linear-gradient(160deg, #181b24, #11131a);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.qbtn:active {
  transform: scale(0.95);
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.icon-box {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  transition: transform 0.15s ease;
}

.icon-box svg {
  width: 20px;
  height: 20px;
}

.qb-air .icon-box {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.06));
  border: 1px solid rgba(56, 189, 248, 0.3);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
}
.qb-air .icon-box svg { fill: #38bdf8; }

.qb-fm .icon-box {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(147, 51, 234, 0.06));
  border: 1px solid rgba(168, 85, 247, 0.3);
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.15);
}
.qb-fm .icon-box svg { fill: #c084fc; }

.qb-news .icon-box {
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(225, 29, 72, 0.06));
  border: 1px solid rgba(244, 63, 94, 0.3);
  box-shadow: 0 0 12px rgba(244, 63, 94, 0.15);
}
.qb-news .icon-box svg { fill: #fb7185; }

.label {
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: 0.2px;
}

/* ===== CARD COMMON ===== */
.card {
  background: linear-gradient(145deg, #151821, #10121a);
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

/* ===== MODERN POPULAR STATIONS ===== */
#stations {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.station {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 20px;
  background: linear-gradient(145deg, #161922, #11131a);
  border: 1px solid rgba(255, 255, 255, 0.07);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}

.station-thumb {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: cover;
  background: #1a1d26;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  flex-shrink: 0;
}

.station-info {
  flex: 1;
  min-width: 0;
}

.station-name {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.2px;
  margin-bottom: 4px;
}

.program-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  flex-shrink: 0;
  margin-top: 5px;
}

.program {
  font-size: 12.5px;
  font-weight: 500;
  color: #94a3b8;
  line-height: 1.35;
  word-break: break-word;
}

.play {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  flex-shrink: 0;
  text-decoration: none;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
  transition: transform .12s ease;
}

.play svg {
  width: 17px;
  height: 17px;
  fill: #041426;
  margin-left: 2px;
}

.play:active {
  transform: scale(0.92);
}

/* ===== POPULAR STATES ===== */
.state-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 12px;
}

.state-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  color: #cbd5e1;
  letter-spacing: .2px;
}

.state-item:active {
  background: rgba(255, 255, 255, 0.06);
}

.view-all-states {
  display: block;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #38bdf8;
  padding: 8px 0 4px;
}
</style>
</head>

<body>
<!-- TOP AD BANNER -->
<a href="go:COMM"> 
  <div class="top-ad">
    <img src="https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/file_0000000021e08211b4960dad0c90dbff.jpg" alt="AIR Banner">
  </div>
</a>

<!-- LIVE CRICKET SCORE STRIP -->
<div class="cricket-strip-container" id="cricketSection" style="display: none;">
  <div class="cricket-card" id="cricketCard"></div>
</div>

<div class="container">

<!-- MODERN QUICK BUTTONS -->
<div class="quick-buttons">

  <a href="go:A2" class="qb-air">
    <div class="qbtn">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M3 10v8a2 2 0 002 2h14a2 2 0 002-2v-8H3zm16 8H5v-6h14v6zM7 4l10 4H7V4zm2 9h3v3H9v-3zm7 1a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        </svg>
      </div>
      <div class="label">AIR Radio</div>
    </div>
  </a>

  <a href="go:FM2" class="qb-fm">
    <div class="qbtn">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 019 9h-2a7 7 0 00-14 0H3a9 9 0 019-9zm0 6a3 3 0 013 3h-2a1 1 0 00-2 0H9a3 3 0 013-3zm-1 8h2v4h-2z"/>
        </svg>
      </div>
      <div class="label">FM Radio</div>
    </div>
  </a>

  <a href="go:LIVEN" class="qb-news">
    <div class="qbtn">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M3 6h18v12H3zM10 9l5 3-5 3zM8 20h8v-2H8z"/>
        </svg>
      </div>
      <div class="label">Live News</div>
    </div>
  </a>

</div>

<!-- Popular Stations & States -->
<div id="homeContent">

  <h2 class="section-title">🔥 Popular Stations</h2>
  <div id="stations"></div>

  <h2 class="section-title">📍 Popular States</h2>

  <div class="card">
    <div class="state-grid">
      <a href="go:DELHI" class="state-item">Delhi</a>
      <a href="go:UP" class="state-item">Uttar Pradesh</a>
      <a href="go:MH" class="state-item">Maharashtra</a>
      <a href="go:BIHAR" class="state-item">Bihar</a>
      <a href="go:WB" class="state-item">West Bengal</a>
      <a href="go:TN" class="state-item">Tamil Nadu</a>
    </div>

    <a href="go:A2" class="view-all-states">View All States →</a>
  </div>
</div>

</div>

<script>
/* ===== LIVE CRICKET SCORE LOGIC ===== */
const matchId = "98317";

async function fetchLiveScore() {
  const cloudflareProxyUrl = `https://cricvoice.aminurmarch.workers.dev/?matchId=${matchId}&_t=${Date.now()}`;
  try {
    const response = await fetch(cloudflareProxyUrl);
    if (!response.ok) return;

    const data = await response.json();
    if (data && data.data && data.data.length > 0) {
      renderCricketStrip(data.data[0].livescore);
    }
  } catch (error) {
    console.error("Live Cricket Score Error:", error);
  }
}

function extractMatchNote(scoreData) {
  if (scoreData.result && scoreData.result.trim() !== "") {
    return scoreData.result;
  }
  if (scoreData.status_note && scoreData.status_note.trim() !== "") {
    return scoreData.status_note;
  }

  const isScheduled = scoreData.status === 1 || (scoreData.status_str && scoreData.status_str.toLowerCase().includes("sched"));
  
  if (isScheduled && scoreData.date_start_ist) {
    try {
      const parts = scoreData.date_start_ist.split(" ");
      if (parts[1]) {
        const timeSegments = parts[1].split(":");
        let hour = parseInt(timeSegments[0], 10);
        let min = parseInt(timeSegments[1], 10);

        const ampm = hour >= 12 ? "PM" : "AM";
        const hour12 = hour % 12 || 12;
        const formattedMin = min < 10 ? "0" + min : min;
        const timeFormatted = `${hour12}:${formattedMin} ${ampm} IST`;

        if (hour >= 17) {
          return `Match starts tonight at ${timeFormatted}`;
        } else {
          return `Match starts today at ${timeFormatted}`;
        }
      }
    } catch (e) {
      console.error("Time Parsing Error:", e);
    }
  }

  if (isScheduled) {
    return "Match starts tonight at 8:00 PM IST";
  }

  return scoreData.subtitle || "";
}

function renderCricketStrip(scoreData) {
  if (!scoreData) return;

  const section = document.getElementById("cricketSection");
  const card = document.getElementById("cricketCard");

  const tournament = scoreData.competition ? (scoreData.competition.abbr || scoreData.competition.title) : "Women's Asia Cup";
  const teamA = scoreData.teama || {};
  const teamB = scoreData.teamb || {};
  
  // Team A আৰু Team B ৰ ঠাইত প্ৰকৃত নাম আৰু ল'গ'
  const teamAName = teamA.short_name || teamA.name || "IND-W";
  const teamBName = teamB.short_name || teamB.name || "PAK-W";
  const teamALogo = teamA.logo_url || "https://gcdnimages.entitysport.com/assets/uploads/2025/09/IND-w.webp";
  const teamBLogo = teamB.logo_url || "https://gcdnimages.entitysport.com/assets/uploads/2025/09/Pakistan.webp";

  const teamAScore = teamA.scores_full || teamA.scores || "";
  const teamBScore = teamB.scores_full || teamB.scores || "";
  
  let statusText = scoreData.status_str || "Scheduled";
  let noteText = extractMatchNote(scoreData);

  card.innerHTML = `
    <div class="cs-meta">
      <span class="cs-tour">${tournament}</span>
      <span class="cs-status-tag">
        <span class="live-dot" style="margin-top: 0;"></span>
        ${statusText}
      </span>
    </div>

    <div class="cs-match-row">
      <div class="cs-team">
        <img class="cs-flag" src="${teamALogo}" alt="${teamAName}" onerror="this.style.opacity='0'">
        <div class="cs-team-info">
          <span class="cs-team-name">${teamAName}</span>
          ${teamAScore ? `<span class="cs-team-score">${teamAScore}</span>` : ''}
        </div>
      </div>

      <div class="cs-vs">VS</div>

      <div class="cs-team right">
        <img class="cs-flag" src="${teamBLogo}" alt="${teamBName}" onerror="this.style.opacity='0'">
        <div class="cs-team-info">
          <span class="cs-team-name">${teamBName}</span>
          ${teamBScore ? `<span class="cs-team-score">${teamBScore}</span>` : ''}
        </div>
      </div>
    </div>

    <div class="cs-bottom-bar">
      <div class="cs-note">${noteText}</div>
      <a href="go:card1" class="cs-btn-card">Scorecard</a>
    </div>
  `;

  section.style.display = "block";
}

fetchLiveScore();
setInterval(fetchLiveScore, 60000);

/* ===== RADIO & SCHEDULE LOGIC ===== */
if (!window.SCHEDULE_DATA) window.SCHEDULE_DATA = [];

const popularStations = [
  { 
    name: "FM Rainbow", 
    code: "FMR", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(2).jpg" 
  },
  { 
    name: "Vividh Bharati", 
    code: "N002", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images.jpg" 
  },
  { 
    name: "FM Gold", 
    code: "FMG", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(1).jpg" 
  },
  { 
    name: "Indraprastha", 
    code: "INDRA", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(3).jpg" 
  }
];

const defaultFallbackLogo = "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/file_0000000021e08211b4960dad0c90dbff.jpg";
const lastProgram = {};

function timeToMinutes(t) {
  if (!t) return 0;
  const match = t.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if (!match) return 0;
  
  let h = parseInt(match[1], 10);
  let m = parseInt(match[2], 10);
  const meridiem = match[3] ? match[3].toUpperCase() : null;

  if (meridiem === "PM" && h !== 12) h += 12;
  if (meridiem === "AM" && h === 12) h = 0;
  return (h || 0) * 60 + (m || 0);
}

function getCurrentProgram(channel) {
  if (!window.SCHEDULE_DATA || !window.SCHEDULE_DATA.length) {
    return lastProgram[channel] || "Live Broadcast";
  }

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const list = window.SCHEDULE_DATA
    .filter(p => p.channel && p.channel.toLowerCase().includes(channel.toLowerCase().trim()))
    .map(p => ({ ...p, min: timeToMinutes(p.time) }))
    .sort((a, b) => a.min - b.min);

  if (!list.length) return lastProgram[channel] || "Live Broadcast";

  let currentTitle = "Live Broadcast";

  if (nowMin < list[0].min) {
    currentTitle = list[list.length - 1].title;
  } else {
    for (let i = 0; i < list.length; i++) {
      const cur = list[i];
      const next = list[i + 1];
      if (nowMin >= cur.min && (!next || nowMin < next.min)) {
        currentTitle = cur.title;
        break;
      }
    }
  }

  lastProgram[channel] = currentTitle;
  return currentTitle;
}

function renderStations() {
  const box = document.getElementById("stations");
  if (!box) return;
  box.innerHTML = "";

  popularStations.forEach(st => {
    const div = document.createElement("div");
    div.className = "station";

    div.innerHTML = `
      <img src="${st.logo}" class="station-thumb" alt="${st.name}" onerror="this.onerror=null;this.src='${defaultFallbackLogo}';">
      <div class="station-info">
        <div class="station-name">${st.name}</div>
        <div class="program-row">
          <span class="live-dot"></span>
          <div class="program" data-channel="${st.name}">
            ${getCurrentProgram(st.name)}
          </div>
        </div>
      </div>
      <a href="go:${st.code}" class="play" aria-label="Play ${st.name}">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </a>
    `;

    box.appendChild(div);
  });
}

function updateProgramsOnly() {
  document.querySelectorAll(".program").forEach(el => {
    const channel = el.getAttribute("data-channel");
    if (channel) {
      el.textContent = getCurrentProgram(channel);
    }
  });
}

renderStations();
setInterval(updateProgramsOnly, 60000);
</script>

<script src="https://airappandroid.github.io/allindiaradio/schedule.js" onload="updateProgramsOnly()"></script>
</body>
</html>
