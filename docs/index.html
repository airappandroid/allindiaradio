<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR Radio</title>

<style>
* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

a {
  text-decoration: none;
  color: inherit;
}
a:active, a:focus {
  outline: none;
}

html {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ===== BASE ===== */
body {
  margin: 0;
  font-family: Roboto, system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #1e1f22;
  color: #e8e8e8;
}

/* ===== TOP MOBILE AD (320x100) ===== */
.top-ad {
  width: 100%;
  padding: 8px 10px 0;
  display: flex;
  justify-content: center;
  background: #1e1f22;
}

.top-ad img {
  width: 100%;
  max-width: 320px;
  height: 100px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  box-shadow: 0 2px 4px rgba(0,0,0,.25);
}

/* ===== LIVE CRICKET SCORE STRIP ===== */
.cricket-strip-container {
  padding: 8px 14px 2px;
}

.cricket-card {
  background: linear-gradient(145deg, #2c2e33, #222428);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
}

.cricket-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(135deg, #4cc2ff, #0091ea);
}

.cs-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.cs-tour {
  color: #4cc2ff;
  max-width: 70%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-status-tag {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #00e676;
  text-transform: uppercase;
}

.cs-match-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cs-team {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.cs-team.right {
  flex-direction: row-reverse;
  text-align: right;
}

.cs-flag {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  background: #1a1b1e;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.cs-team-info {
  display: flex;
  flex-direction: column;
}

.cs-team-name {
  font-size: 13.5px;
  font-weight: 700;
  color: #ffffff;
}

.cs-team-score {
  font-size: 12px;
  font-weight: 600;
  color: #cbd5e1;
}

.cs-vs {
  font-size: 11px;
  font-weight: 800;
  color: #64748b;
  padding: 0 10px;
}

/* BOTTOM BAR: NOTE (LEFT) & SCORECARD BUTTON (RIGHT) */
.cs-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: rgba(255, 255, 255, 0.03);
  padding: 6px 10px;
  border-radius: 10px;
  margin-top: 2px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.cs-note {
  font-size: 11.5px;
  color: #a6abb4;
  text-align: left;
  line-height: 1.3;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cs-btn-card {
  font-size: 11px;
  font-weight: 700;
  color: #001f33;
  background: linear-gradient(135deg, #4cc2ff, #0091ea);
  padding: 4px 12px;
  border-radius: 20px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .1s ease, opacity .1s ease;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0, 145, 234, 0.3);
}

.cs-btn-card:active {
  transform: scale(0.94);
  opacity: 0.9;
}

/* ===== LAYOUT ===== */
.container {
  padding: 10px 14px 14px;
}

.section-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .4px;
  margin: 18px 0 10px;
  color: #ffffff;
}

/* ===== QUICK BUTTONS ONE ROW ===== */
.quick-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.quick-buttons > * {
  flex: 1;
}
.quick-buttons a {
  flex: 1;
  min-width: 0;
  text-decoration: none;
}

.qbtn {
  padding: 12px 6px;
  border-radius: 16px;
  background: #2b2d31;
  border: 1px solid #33363c;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #e8e8e8;
  box-shadow: 0 2px 4px rgba(0,0,0,.25);
  transition: transform .1s ease, opacity .1s ease;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.qbtn:active {
  transform: scale(.96);
  opacity: .85;
}

/* ICON STYLE */
.icon {
  margin-bottom: 4px;
}

.icon svg {
  width: 20px;
  height: 20px;
  fill: #4cc2ff;
}

/* TEXT WRAP */
.label {
  line-height: 1.15;
  word-break: break-word;
}

/* ===== CARD COMMON ===== */
.card {
  background: #2b2d31;
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

/* ===== MODERN POPULAR STATIONS WITH LOGO ===== */
#stations {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.station {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 20px;
  background: linear-gradient(145deg, #2c2e33, #222428);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 3px 10px rgba(0,0,0,.25);
}

/* STATION LOGO / THUMBNAIL */
.station-thumb {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: cover;
  background: #1a1b1e;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
  flex-shrink: 0;
}

.station-info {
  flex: 1;
  min-width: 0;
}

.station-name {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.2px;
  margin-bottom: 4px;
}

.program-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
}

/* SLEEK GLOWING LIVE DOT */
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00e676;
  box-shadow: 0 0 6px rgba(0, 230, 118, 0.7);
  flex-shrink: 0;
  margin-top: 4px;
}

/* FULL VISIBILITY FOR PROGRAM NAME */
.program {
  font-size: 12.5px;
  font-weight: 500;
  color: #a6abb4;
  line-height: 1.35;
  word-break: break-word;
  white-space: normal;
}

/* TOUCH TARGET OPTIMIZED PLAY BUTTON */
.play {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #4cc2ff, #0091ea);
  flex-shrink: 0;
  text-decoration: none;
  box-shadow: 0 3px 8px rgba(0, 145, 234, 0.35);
  transition: transform .12s ease, box-shadow .12s ease;
}

.play svg {
  width: 18px;
  height: 18px;
  fill: #001f33;
  margin-left: 2px;
}

.play:active {
  transform: scale(.92);
  box-shadow: 0 1px 4px rgba(0, 145, 234, 0.2);
}

/* ===== POPULAR STATES (OUTLINE CHIPS GRID) ===== */
.state-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 12px;
}

.state-item {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  color: #e2e8f0;
  text-decoration: none;
  letter-spacing: .2px;
  display: block;
}

.view-all-states {
  display: block;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #4cc2ff;
  text-decoration: none;
  padding: 8px 0 4px;
}
</style>
</head>

<body>
<!-- TOP AD BANNER -->
<a href="go:COMM"> 
  <div class="top-ad">
    <img src="https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/file_0000000021e08211b4960dad0c90dbff.jpg" alt="AIR Banner">
  </div>
</a>

<!-- LIVE CRICKET SCORE STRIP -->
<div class="cricket-strip-container" id="cricketSection" style="display: none;">
  <div class="cricket-card" id="cricketCard"></div>
</div>

<div class="container">

<!-- QUICK BUTTONS -->
<div class="quick-buttons">

  <!-- AIR RADIO -->
  <a href="go:A2">
    <div class="qbtn">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 10v8a2 2 0 002 2h14a2 2 0 002-2v-8H3zm16 8H5v-6h14v6zM7 4l10 4H7V4zm2 9h3v3H9v-3zm7 1a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
        </svg>
      </div>
      <div class="label">AIR Radio</div>
    </div>
  </a>

  <!-- FM RADIO -->
  <a href="go:FM2">
    <div class="qbtn">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 019 9h-2a7 7 0 00-14 0H3a9 9 0 019-9zm0 6a3 3 0 013 3h-2a1 1 0 00-2 0H9a3 3 0 013-3zm-1 8h2v4h-2z"/>
        </svg>
      </div>
      <div class="label">FM Radio</div>
    </div>

  <a href="go:LIVEN">
    <div class="qbtn">

      </div>

<!-- Popular Stations & States -->
<div id="homeContent">

  <h2 class="section-title">🔥 Popular Stations</h2>

  <h2 class="section-title">📍 Popular States</h2>

  <div class="card">

</div>

</div>

<!-- 1. মূল JavaScript লজিক -->
<script>
/* ===== LIVE CRICKET SCORE LOGIC ===== */
const matchId = "98315";

async function fetchLiveScore() {
  const cloudflareProxyUrl = `https://cricvoice.aminurmarch.workers.dev/?matchId=${matchId}&_t=${Date.now()}`;
  try {
    const response = await fetch(cloudflareProxyUrl);
    if (!response.ok) return;

    const data = await response.json();
    if (data && data.data && data.data.length > 0) {
      renderCricketStrip(data.data[0].livescore);
    }
  } catch (error) {
    console.error("Live Cricket Score Error:", error);
  }
}

function renderCricketStrip(scoreData) {
  if (!scoreData) return;

  const section = document.getElementById("cricketSection");
  const card = document.getElementById("cricketCard");

  const tournament = scoreData.competition ? (scoreData.competition.abbr || scoreData.competition.title) : "Cricket";
  const teamA = scoreData.teama || {};
  const teamB = scoreData.teamb || {};
  
  const teamAScore = teamA.scores_full || teamA.scores || "";
  const teamBScore = teamB.scores_full || teamB.scores || "";
  
  let statusText = scoreData.status_str || "Scheduled";
  let noteText = scoreData.status_note || scoreData.result || scoreData.subtitle || "";

  card.innerHTML = `
    <div class="cs-meta">
      <span class="cs-tour">${tournament}</span>
      <span class="cs-status-tag">
        <span class="live-dot" style="margin-top: 0;"></span>
        ${statusText}
      </span>
    </div>

    <div class="cs-match-row">
      <div class="cs-team">
        <img class="cs-flag" src="${teamA.logo_url || ''}" alt="${teamA.short_name || 'Team A'}" onerror="this.style.opacity='0'">
        <div class="cs-team-info">
          <span class="cs-team-name">${teamA.short_name || teamA.name || 'Team A'}</span>
          ${teamAScore ? `<span class="cs-team-score">${teamAScore}</span>` : ''}
        </div>
      </div>

      <div class="cs-vs">VS</div>

      <div class="cs-team right">
        <img class="cs-flag" src="${teamB.logo_url || ''}" alt="${teamB.short_name || 'Team B'}" onerror="this.style.opacity='0'">
        <div class="cs-team-info">
          <span class="cs-team-name">${teamB.short_name || teamB.name || 'Team B'}</span>
          ${teamBScore ? `<span class="cs-team-score">${teamBScore}</span>` : ''}
        </div>
      </div>
    </div>

    <div class="cs-bottom-bar">
      <div class="cs-note">${noteText}</div>
      <a href="go:card1" class="cs-btn-card">Scorecard</a>
    </div>
  `;

  section.style.display = "block";
}

// স্ক'ৰ আৰম্ভণি আৰু প্ৰতি ১ মিনিটৰ মূৰে মূৰে আপডেট (60000ms)
fetchLiveScore();
setInterval(fetchLiveScore, 60000);


/* ===== RADIO & SCHEDULE LOGIC ===== */
if (!window.SCHEDULE_DATA) window.SCHEDULE_DATA = [];

const popularStations = [
  { 
    name: "FM Rainbow", 
    code: "FMR", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(2).jpg" 
  },
  { 
    name: "Vividh Bharati", 
    code: "N002", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images.jpg" 
  },
  { 
    name: "FM Gold", 
    code: "FMG", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(1).jpg" 
  },
  { 
    name: "Indraprastha", 
    code: "INDRA", 
    logo: "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/images%20(3).jpg" 
  }
];

const defaultFallbackLogo = "https://raw.githubusercontent.com/airappandroid/mp3-files/refs/heads/main/file_0000000021e08211b4960dad0c90dbff.jpg";
const lastProgram = {};

function timeToMinutes(t) {
  if (!t) return 0;
  const match = t.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if (!match) return 0;
  
  let h = parseInt(match[1], 10);
  let m = parseInt(match[2], 10);
  const meridiem = match[3] ? match[3].toUpperCase() : null;

  if (meridiem === "PM" && h !== 12) h += 12;
  if (meridiem === "AM" && h === 12) h = 0;
  return (h || 0) * 60 + (m || 0);
}

function getCurrentProgram(channel) {
  if (!window.SCHEDULE_DATA || !window.SCHEDULE_DATA.length) {
    return lastProgram[channel] || "Live Broadcast";
  }

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const list = window.SCHEDULE_DATA
    .filter(p => p.channel && p.channel.toLowerCase().includes(channel.toLowerCase().trim()))
    .map(p => ({ ...p, min: timeToMinutes(p.time) }))
    .sort((a, b) => a.min - b.min);

  if (!list.length) return lastProgram[channel] || "Live Broadcast";

  let currentTitle = "Live Broadcast";

  if (nowMin < list[0].min) {
    currentTitle = list[list.length - 1].title;
  } else {
    for (let i = 0; i < list.length; i++) {
      const cur = list[i];
      const next = list[i + 1];
      if (nowMin >= cur.min && (!next || nowMin < next.min)) {
        currentTitle = cur.title;
        break;
      }
    }
  }

  lastProgram[channel] = currentTitle;
  return currentTitle;
}

function renderStations() {
  const box = document.getElementById("stations");
  if (!box) return;
  box.innerHTML = "";

  popularStations.forEach(st => {
    const div = document.createElement("div");
    div.className = "station";

    div.innerHTML = `
      <img src="${st.logo}" class="station-thumb" alt="${st.name}" onerror="this.onerror=null;this.src='${defaultFallbackLogo}';">
      <div class="station-info">
        <div class="station-name">${st.name}</div>
        <div class="program-row">
          <span class="live-dot"></span>
          <div class="program" data-channel="${st.name}">
            ${getCurrentProgram(st.name)}
          </div>
        </div>
      </div>
      <a href="go:${st.code}" class="play" aria-label="Play ${st.name}">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </a>
    `;

    box.appendChild(div);
  });
}

function updateProgramsOnly() {
  document.querySelectorAll(".program").forEach(el => {
    const channel = el.getAttribute("data-channel");
    if (channel) {
      el.textContent = getCurrentProgram(channel);
    }
  });
}

renderStations();
setInterval(updateProgramsOnly, 60000);
</script>

<!-- 2. বাহিৰৰ স্ক্ৰিপ্ট -->
<script src="https://airappandroid.github.io/allindiaradio/schedule.js" onload="updateProgramsOnly()"></script>
</body>
