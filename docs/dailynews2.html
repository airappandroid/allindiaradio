<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIR FM Gold Delhi - Live Stream</title>
  
  <!-- HLS.js for .m3u8 streaming support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b18 0%, #0d0c0b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ffffff;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(235, 180, 50, 0.25);
      border-radius: 28px;
      padding: 30px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .station-logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d4af37, #8c6d1f);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.35);
    }

    .station-logo svg {
      width: 55px;
      height: 55px;
      fill: #121212;
    }

    .station-title {
      font-size: 22px;
      font-weight: 700;
      color: #f7d070;
      margin-bottom: 4px;
    }

    .station-subtitle {
      font-size: 13px;
      color: #a0a0a0;
      margin-bottom: 18px;
    }

    /* Equalizer Waves */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 30px;
      margin-bottom: 22px;
    }

    .bar {
      width: 4px;
      height: 6px;
      background: #f7d070;
      border-radius: 4px;
      transition: height 0.2s ease;
    }

    .visualizer.playing .bar {
      animation: soundwave 1s infinite alternate ease-in-out;
    }

    .visualizer.playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .visualizer.playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .visualizer.playing .bar:nth-child(3) { animation-delay: 0.5s; }
    .visualizer.playing .bar:nth-child(4) { animation-delay: 0.2s; }
    .visualizer.playing .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes soundwave {
      0% { height: 6px; }
      100% { height: 26px; }
    }

    .play-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f7d070, #c89d2d);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(247, 208, 112, 0.35);
      transition: transform 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.93);
    }

    .play-btn svg {
      width: 30px;
      height: 30px;
      fill: #141414;
    }

    /* Volume Slider */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      padding: 0 10px;
    }

    .volume-container svg {
      width: 18px;
      height: 18px;
      fill: #888888;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 4px;
      background: #333333;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f7d070;
      cursor: pointer;
    }

    .status-text {
      font-size: 13px;
      color: #888;
      margin-top: 14px;
      min-height: 18px;
    }

    /* Background Play & Battery Optimization Card */
    .battery-box {
      margin-top: 22px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(247, 208, 112, 0.3);
      border-radius: 12px;
      font-size: 12px;
      color: #b5b5b5;
      text-align: left;
    }

    .battery-box strong {
      color: #f7d070;
      display: block;
      margin-bottom: 4px;
    }

    .battery-box p {
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .battery-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 7px 0;
      background: rgba(247, 208, 112, 0.15);
      border: 1px solid #f7d070;
      color: #f7d070;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .battery-btn:active {
      background: rgba(247, 208, 112, 0.3);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="live-badge">
      <div class="live-dot"></div>
      LIVE ON AIR
    </div>

    <div class="station-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>

    <h1 class="station-title">AIR FM Gold</h1>
    <p class="station-subtitle">100.1 MHz &bull; Delhi</p>

    <!-- Waveform Visualizer -->
    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Play/Pause Button -->
    <button class="play-btn" id="playBtn" aria-label="Play or Pause">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <!-- Volume Controller -->
    <div class="volume-container">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>

    <div class="status-text" id="statusText">Tap play to start listening</div>

    <!-- Background Optimization Info & Intent Trigger -->
    <div class="battery-box">
      <strong>Background Playback Setup</strong>
      <p>To avoid playback stopping when minimized or screen locked, change battery setting to <b>Unrestricted</b>.</p>
      <a href="intent:#Intent;action=android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS;end" class="battery-btn">
        Open Battery Settings
      </a>
    </div>
  </div>

  <audio id="audioElement" preload="none"></audio>

  <script>
    const streamUrl = "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio005/hlspbaudio00564kbps.m3u8";
    const audio = document.getElementById("audioElement");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const visualizer = document.getElementById("visualizer");
    const volumeSlider = document.getElementById("volumeSlider");
    const statusText = document.getElementById("statusText");

    let isPlaying = false;
    let hls = null;

    // Initialize HLS Stream
    function initHls() {
      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(audio);

        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                statusText.innerText = "Network error. Reconnecting...";
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                statusText.innerText = "Media error. Recovering...";
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                statusText.innerText = "Playback error occurred.";
                break;
            }
          }
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = streamUrl;
      } else {
        statusText.innerText = "HLS streaming is not supported on this browser.";
      }
    }

    // Media Session API Setup for Lock Screen & Notification Center
    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'AIR FM Gold',
          artist: 'All India Radio (Delhi)',
          album: '100.1 MHz Live Stream',
          artwork: [
            { src: 'https://upload.wikimedia.org/wikipedia/commons/2/2f/All_India_Radio_logo.svg', sizes: '512x512', type: 'image/svg+xml' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          startPlayback();
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          pausePlayback();
        });

        navigator.mediaSession.setActionHandler('stop', () => {
          pausePlayback();
        });
      }
    }

    function startPlayback() {
      if (!hls && !audio.src) {
        initHls();
      }
      statusText.innerText = "Connecting live stream...";
      audio.play().then(() => {
        updateUI(true);
        setupMediaSession();
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = "playing";
        }
      }).catch(err => {
        console.error(err);
        statusText.innerText = "Tap play to allow audio playback.";
        updateUI(false);
      });
    }

    function pausePlayback() {
      audio.pause();
      updateUI(false);
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }
    }

    function togglePlay() {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function updateUI(playing) {
      isPlaying = playing;
      if (playing) {
        visualizer.classList.add("playing");
        statusText.innerText = "Playing Live: AIR FM Gold";
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
      } else {
        visualizer.classList.remove("playing");
        statusText.innerText = "Stream paused";
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
      }
    }

    playBtn.addEventListener("click", togglePlay);

    volumeSlider.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });
  </script>
</body>
</html>
