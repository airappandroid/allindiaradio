<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All India Radio Stations</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131927;
      --card-border: #1e2638;
      --text-main: #ffffff;
      --text-sub: #8a99ad;
      --accent-cyan: #00a2ec;
      --accent-green: #22c55e;
      --fav-active: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 60px;
    }

    /* Sticky Header: ছলিড বেকগ্ৰাউণ্ড ব্যৱহাৰ কৰা হৈছে যাতে GPU compositing লেগ নহয় */
    .sticky-header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding-bottom: 12px;
      z-index: 100;
    }

    .search-box-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-sub);
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14.5px;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      outline: none;
    }

    .search-box::placeholder {
      color: #64748b;
    }

    .search-box:focus {
      border-color: var(--accent-cyan);
    }

    .filter-row {
      display: flex;
      gap: 10px;
    }

    .state-picker-btn {
      flex: 1;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .state-picker-btn svg {
      width: 14px;
      height: 14px;
      fill: var(--text-sub);
    }

    .fav-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .fav-toggle-btn.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--fav-active);
    }

    .fav-toggle-btn.active svg {
      fill: var(--fav-active);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* 3-Column Grid */
    .station-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    /* Card Box: transform translateZ(0) যোগ কৰা হৈছে মসৃণ স্ক্ৰলিঙৰ বাবে */
    .station-card-grid {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      content-visibility: auto;
      contain-intrinsic-size: 0 170px;
      transform: translateZ(0);
    }

    /* Artwork Container */
    .station-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0f1d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .station-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .station-fallback-svg {
      width: 34px;
      height: 34px;
      fill: #38bdf8;
      opacity: 0.85;
    }

    /* Floating Badges: box-shadow আঁতৰোৱা হৈছে */
    .status-dot-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      z-index: 2;
    }

    /* Heart Button: backdrop-filter আৰু shadow আঁতৰাই ছলিড বেকগ্ৰাউণ্ড দিয়া হৈছে */
    .fav-btn-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111726;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      outline: none;
    }

    .fav-btn-badge svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .fav-btn-badge svg path {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fav-btn-badge.active {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
    }

    .fav-btn-badge.active svg path {
      fill: #ef4444;
      stroke: #ef4444;
    }

    .station-name-grid {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      height: 30px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
      word-break: break-word;
      text-align: center;
      width: 100%;
      padding: 0 2px;
    }

    /* Play Button: box-shadow আঁতৰোৱা হৈছে */
    .play-circle-grid {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
    }

    .play-circle-grid svg {
      width: 13px;
      height: 13px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sub);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 13, 0.85);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
      flex-direction: column;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: #111726;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border: 1px solid var(--card-border);
      border-bottom: none;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: #334155;
      border-radius: 4px;
      margin: 10px auto 4px auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 16px;
    }

    .modal-header-tag {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-banner {
      text-align: center;
      padding: 8px 16px 12px 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .modal-subtitle {
      font-size: 12.5px;
      color: var(--text-sub);
    }

    .modal-search-wrapper {
      padding: 0 16px 10px 16px;
      position: relative;
    }

    .modal-search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .modal-search-input:focus {
      border-color: var(--accent-cyan);
    }

    .modal-search-icon {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: var(--text-sub);
    }

    .state-list-scroll {
      overflow-y: auto;
      padding: 0 16px 24px 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .state-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-main);
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .state-item.selected .radio-circle {
      border-color: var(--accent-cyan);
    }

    .state-item.selected .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="sticky-header">
    <div class="search-box-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707a1 1 0 001.414-1.414l-4.707-4.707A8 8 0 0010 2zm-6 8a6 6 0 1112 0 6 6 0 01-12 0z"/></svg>
      <input type="text" id="searchInput" class="search-box" placeholder="Search station..." oninput="handleSearchDebounce()">
    </div>
    
    <div class="filter-row">
      <button class="state-picker-btn" onclick="openStateModal()">
        <span id="selectedStateLabel">Select State</span>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

      <button id="favFilterBtn" class="fav-toggle-btn" onclick="toggleFavFilter()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        Favorites
      </button>
    </div>
  </div>

  <div class="meta-bar">
    <span id="stationCountText">Please select a state</span>
  </div>

  <!-- Station Grid -->
  <div id="stationContainer" class="station-grid"></div>
  
  <div id="emptyMessage" class="empty-state" style="display: none;">
    <p id="emptyTitle" style="font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #fff;">Please Select a State</p>
    <p id="emptySub" style="font-size: 13px;">Choose your state to start listening to local stations.</p>
  </div>

  <!-- State Selection Modal -->
  <div id="stateModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span class="modal-header-tag">Regions</span>
        <button class="modal-close-btn" onclick="closeStateModal()">&times;</button>
      </div>

      <div class="modal-banner">
        <h2 class="modal-title">Pick your state</h2>
        <p class="modal-subtitle">Only stations from your chosen state will load</p>
      </div>

      <div class="modal-search-wrapper">
        <svg class="modal-search-icon" viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.293 14.293l4.707 4.707a1 1 0 001.414-1.414l-4.707-4.707A8 8 0 0010 2zm-6 8a6 6 0 1112 0 6 6 0 01-12 0z"/></svg>
        <input type="text" id="modalStateSearch" class="modal-search-input" placeholder="Search state..." oninput="filterModalStates()">
      </div>

      <div id="modalStateList" class="state-list-scroll"></div>
    </div>
  </div>

  <!-- External Stations Data -->
  <script src="https://airappandroid.github.io/growify/stations.js"></script>

  <script>
    function getSafeStorage(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    }

    function setSafeStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    let favorites = getSafeStorage("air_fav_stations", []);
    let showOnlyFavs = false;
    const uniqueStates = [...new Set(stations.map(s => s.state))].sort();
    let selectedState = getSafeStorage("air_user_state", "");

    const defaultIconSvg = `<svg class="station-fallback-svg" viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-.83-.51-1.57-1.24-1.85L12 2.65 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-8v-2h8v2zm0 4h-8v-2h8v2z"/></svg>`;

    function handleImgError(imgElement) {
      imgElement.outerHTML = defaultIconSvg;
    }

    function init() {
      buildModalStatesOnce();

      if (!selectedState) {
        document.getElementById("selectedStateLabel").textContent = "Select State";
        document.getElementById("stationCountText").textContent = "No state selected";
        document.getElementById("emptyMessage").style.display = "block";
        openStateModal();
      } else {
        document.getElementById("selectedStateLabel").textContent = selectedState;
        filterStations();
      }
    }

    function buildModalStatesOnce() {
      const listEl = document.getElementById("modalStateList");
      listEl.innerHTML = uniqueStates.map(state => `
        <div class="state-item" data-state="${state}">
          <span>${state}</span>
          <div class="radio-circle"></div>
        </div>
      `).join('');

      listEl.addEventListener("click", (e) => {
        const item = e.target.closest(".state-item");
        if (item) {
          selectState(item.getAttribute("data-state"));
        }
      });
    }

    function openStateModal() {
      const searchInput = document.getElementById("modalStateSearch");
      searchInput.value = "";
      
      const items = document.querySelectorAll(".state-item");
      items.forEach(item => {
        item.style.display = "flex";
        item.classList.toggle("selected", item.getAttribute("data-state") === selectedState);
      });

      document.getElementById("stateModal").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeStateModal() {
      document.getElementById("stateModal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function closeModalOnOutsideClick(e) {
      if (e.target.id === "stateModal") {
        closeStateModal();
      }
    }

    function selectState(stateName) {
      selectedState = stateName;
      setSafeStorage("air_user_state", stateName);
      document.getElementById("selectedStateLabel").textContent = stateName || "Select State";
      closeStateModal();
      filterStations();
    }

    function filterModalStates() {
      const q = document.getElementById("modalStateSearch").value.toLowerCase().trim();
      const items = document.querySelectorAll(".state-item");
      items.forEach(item => {
        const text = item.getAttribute("data-state").toLowerCase();
        item.style.display = (!q || text.includes(q)) ? "flex" : "none";
      });
    }

    function renderStations(list) {
      const container = document.getElementById("stationContainer");
      const emptyMsg = document.getElementById("emptyMessage");
      const countLabel = document.getElementById("stationCountText");

      countLabel.textContent = showOnlyFavs 
        ? `Showing ${list.length} favorite station(s)` 
        : `Showing ${list.length} station(s)`;

      if (list.length === 0) {
        container.innerHTML = "";
        if (showOnlyFavs) {
          document.getElementById("emptyTitle").textContent = "No Favorites Found";
          document.getElementById("emptySub").textContent = "Heart icon-ত টেপ কৰি ষ্টেচন ফেভাৰিট কৰক।";
        } else {
          document.getElementById("emptyTitle").textContent = "No Stations Found";
          document.getElementById("emptySub").textContent = "Try searching with another keyword or pick another state.";
        }
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      const html = list.map(station => {
        const isFav = favorites.includes(station.id);
        
        const logoContent = station.logo 
          ? `<img class="station-logo-img" src="${station.logo}" alt="${station.name}" loading="lazy" decoding="async" onerror="handleImgError(this)">` 
          : defaultIconSvg;

        return `
          <div class="station-card-grid" onclick="window.location.href='go:${station.id}'">
            <div class="station-img-wrap">
              ${logoContent}
              <span class="status-dot-badge"></span>
              <button class="fav-btn-badge ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${station.id}')" aria-label="Favorite">
                <svg viewBox="0 0 24 24">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
            </div>
            
            <div class="station-name-grid" title="${station.name}">${station.name}</div>
            
            <div class="play-circle-grid">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    let searchTimer;
    function handleSearchDebounce() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(filterStations, 100);
    }

    function filterStations() {
      if (!showOnlyFavs && !selectedState) {
        document.getElementById("stationContainer").innerHTML = "";
        document.getElementById("stationCountText").textContent = "Please select a state";
        document.getElementById("emptyTitle").textContent = "Please Select a State";
        document.getElementById("emptySub").textContent = "Choose your state to start listening to local stations.";
        document.getElementById("emptyMessage").style.display = "block";
        return;
      }

      const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = stations.filter(s => {
        const matchesState = showOnlyFavs ? true : (s.state === selectedState);
        const matchesSearch = !searchQuery || s.name.toLowerCase().includes(searchQuery);
        const matchesFav = !showOnlyFavs || favorites.includes(s.id);
        return matchesState && matchesSearch && matchesFav;
      });

      renderStations(filtered);
    }

    function toggleFavorite(event, id) {
      event.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      setSafeStorage("air_fav_stations", favorites);
      filterStations();
    }

    function toggleFavFilter() {
      showOnlyFavs = !showOnlyFavs;
      document.getElementById("favFilterBtn").classList.toggle("active", showOnlyFavs);
      filterStations();
    }

    init();
  </script>
</body>
</html>
