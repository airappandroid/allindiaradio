<style>
body{
  margin:0;
  background:#0c1220;
  font-family:Arial, sans-serif;
  color:#fff;
  padding:12px;
  overflow-x:hidden;   /* 🔥 सबसे जरूरी */
}




/* ===== TOPBAR ===== */
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  background:#0c1220;

  display:flex;
  gap:8px;

  padding:10px 0 10px 0;
}

/* Search + Filter SAME SIZE */
.topbar input,
.topbar select{
  flex:1;
  width:100%;
  box-sizing:border-box;

  padding:10px;
  border:none;
  border-radius:8px;

  font-size:14px;
  outline:none;
}

/* Optional: better mobile tap feel */
.topbar input:focus,
.topbar select:focus{
  box-shadow:0 0 0 2px rgba(45,124,255,.4);
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr)); /* 👈 magic line */
  gap:10px;
}


/* Channel Card */
.channel{
  background:#1b2238;
  border-radius:12px;
  padding:6px;
  aspect-ratio:1/1;
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;

  transition:.25s ease;
box-sizing:border-box;
  width:100%;
}

.channel:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

/* ❤️ Heart */
.heart{
  position:absolute;
  top:8px;
  right:8px;
  font-size:20px;
  cursor:pointer;
  opacity:.5;
  transition:.25s ease;
}
.heart.active{
  opacity:1;
  animation:pop .35s ease;
}

@keyframes pop{
  0%{transform:scale(.6)}
  60%{transform:scale(1.3)}
  100%{transform:scale(1)}
}

/* Logo */
.channel img{
  width:80px;
  height:80px;
  object-fit:contain;
  background:#fff;
  padding:5px;
  border-radius:8px;
}


/* Name */
.ch-name{
  font-size:12px;
  text-align:center;
  margin-top:6px;
  line-height:1.2;

  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

/* Buttons */
.actions{
  display:flex;
  flex-direction:column;   /* 👈 यही main change है */
  gap:6px;
  width:100%;
}


.btn{
  width:100%;
  padding:6px 0;
  border-radius:6px;
  font-size:12px;
  text-decoration:none;
  color:#fff;
  text-align:center;
  width:100%;
  box-sizing:border-box;
}


.audio{background:#2d7cff;}
.video{background:#e63946;}


</style>

function toggleFav(name){
  if(favs.includes(name)){
    favs=favs.filter(f=>f!==name);
  }else{
    favs.push(name);
  }
  localStorage.setItem("FAV_CHANNELS",JSON.stringify(favs));
  render();
}

        c.l===l
