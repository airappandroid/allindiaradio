<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live News Channels</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #090d16;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #f1f5f9;
  padding: 12px;
  overflow-x: hidden;
}

/* ===== MODERN TOPBAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(9, 13, 22, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 8px 0 12px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.input-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.input-box svg {
  position: absolute;
  left: 12px;
  width: 17px;
  height: 17px;
  fill: #64748b;
  pointer-events: none;
}

.input-box input {
  width: 100%;
  padding: 10px 12px 10px 38px;
  background: #141c2e;
  border: 1px solid #222f49;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}

.input-box input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
}

/* Dedicated Favourites Pill Button */
.fav-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #141c2e;
  border: 1px solid #222f49;
  color: #94a3b8;
  padding: 0 12px;
  height: 40px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s ease;
}

.fav-pill svg {
  width: 16px;
  height: 16px;
  fill: #ef4444;
}

.fav-pill.active {
  background: rgba(239, 68, 68, 0.15);
  border-color: #ef4444;
  color: #f87171;
}

.fav-count {
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  border-radius: 10px;
  padding: 1px 6px;
}

/* Language Filter Dropdown */
.lang-select {
  width: 100%;
  padding: 9px 12px;
  background: #141c2e;
  border: 1px solid #222f49;
  border-radius: 8px;
  color: #cbd5e1;
  font-size: 13px;
  outline: none;
}

/* ===== GRID SYSTEM ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

/* Channel Card */
/* Channel Card */
.channel {
  background: #131b2e;
  border: 1px solid #1e293b;
  border-radius: 14px;
  padding: 12px 8px 10px 8px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* 👈 space-between hata kar flex-start karein */
  gap: 8px;                    /* 👈 sabhi elements ke beech clean spacing */
  transition: transform .18s ease, border-color .18s ease;
}

.channel:active {
  transform: scale(0.98);
}

/* Top Heart Icon */
.heart {
  position: absolute;
  top: 8px;
  right: 8px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.heart svg {
  width: 19px;
  height: 19px;
  fill: #475569;
  transition: fill .2s ease, transform .2s ease;
}

.heart.active svg {
  fill: #ef4444;
  animation: heartPop .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes heartPop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* Logo Box */
.logo-box {
  width: 68px;
  height: 68px;
  background: #ffffff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-top: 4px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.logo-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Channel Name */
/* Channel Name */
.ch-name {
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  color: #e2e8f0;
  line-height: 1.2;
  margin: 2px 0 4px 0;         /* 👈 margin kam kiya gaya hai */
  display: -webkit-box;
  -webkit-line-clamp: 1;       /* 👈 single line ya clean layout ke liye */
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Dual Compact Action Buttons */
/* Dual Compact Action Buttons */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  width: 100%;
  margin-top: auto;            /* 👈 card ko naturally fit rakhega */
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 4px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  text-decoration: none;
  color: #ffffff;
  letter-spacing: 0.2px;
  transition: opacity .15s ease;
}

.btn svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
  flex-shrink: 0;
}

.btn:active {
  opacity: 0.8;
}

.btn.audio {
  background: #2563eb;
}

.btn.video {
  background: #dc2626;
}

/* Empty State */
.empty-msg {
  grid-column: span 2;
  text-align: center;
  padding: 40px 10px;
  color: #64748b;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="search-row">
    <div class="input-box">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.905l5.387 5.388a1 1 0 0 1-1.414 1.414l-5.388-5.387A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="search" placeholder="Search Channel..." autocomplete="off">
    </div>

    <!-- Favourites Bahar Button -->
    <button class="fav-pill" id="favFilterBtn" onclick="toggleFavFilter()">

      <span>Favs</span>

/* Channels */
const channels = [
  { n:"Aaj Tak", l:"hindi", a:"go:AN", v:"go:AAJ" },
  { n:"ABP News", l:"hindi", a:"go:ABP1", v:"go:ABP2" },

  { n:"NKTV", l:"assamese", a:"go:NK1", v:"go:NK2" },
  { n:"News Live", l:"assamese", a:"go:NE1", v:"go:NE2" },
  { n:"Pratidin Time", l:"assamese", a:"go:S101", v:"go:PRATI1" },

  { n:"Zee 24 Kalak", l:"gujarati", a:"go:KALAK1", v:"go:KALAK2" },
  { n:"News18 Gujarati", l:"gujarati", a:"go:GUJ1", v:"go:GUJ2" },
  { n:"News18 Punjab", l:"punjabi", a:"go:NE18P1", v:"go:NE18P2" },
  { n:"TV Punjab", l:"punjabi", a:"go:TVP1", v:"go:TVP2" },
  { n:"NEWS18 ODIA", l:"odia", a:"go:N18O1", v:"go:N18O2" },
  { n:"NANDIGHOSHA TV", l:"odia", a:"go:NA1", v:"go:NA2" },
  { n:"OTV", l:"odia", a:"go:OTV1", v:"go:OTV2" }
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const lang = document.getElementById("lang");
const favFilterBtn = document.getElementById("favFilterBtn");
const favCountEl = document.getElementById("favCount");

let favs = JSON.parse(localStorage.getItem("FAV_CHANNELS") || "[]");
let cardMap = {};
let favOnly = false;

// SVG Icons
const SVG_AUDIO = `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
const SVG_VIDEO = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
const SVG_HEART = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

function updateFavBadge(){
  favCountEl.textContent = favs.length;
}

function toggleFav(name, e){
  if(e) e.stopPropagation();
  if(favs.includes(name)){
    favs = favs.filter(f => f !== name);
  } else {
    favs.push(name);
  }
  localStorage.setItem("FAV_CHANNELS", JSON.stringify(favs));
  updateFavBadge();

  // Instant card state update
  const card = cardMap[name];
  if(card){
    const heart = card.querySelector(".heart");
    if(favs.includes(name)){
      heart.classList.add("active");
    } else {
      heart.classList.remove("active");
    }
  }

  if(favOnly){
    applyFilter();
  }
}

function toggleFavFilter(){
  favOnly = !favOnly;
  favFilterBtn.classList.toggle("active", favOnly);
  applyFilter();
}

function buildGrid(){
  grid.innerHTML = "";
  cardMap = {};

  channels.forEach(c => {
    const div = document.createElement("div");
    div.className = "channel";

    const isFav = favs.includes(c.n);

    div.innerHTML = `
      <div class="heart ${isFav ? 'active' : ''}" onclick="toggleFav('${c.n}', event)">
        ${SVG_HEART}
      </div>
      <div class="logo-box">
        <img src="${getLogo(c.n)}" loading="lazy" alt="${c.n}">
      </div>
      <div class="ch-name">${c.n}</div>
      <div class="actions">
        <a href="${c.a}" class="btn audio">${SVG_AUDIO} Audio</a>
        <a href="${c.v}" class="btn video">${SVG_VIDEO} Video</a>
      </div>
    `;

    grid.appendChild(div);
    cardMap[c.n] = div;
  });

  updateFavBadge();
  applyFilter();
}

function applyFilter(){
  const s = search.value.trim().toLowerCase();
  const l = lang.value;
  let visibleCount = 0;

  channels.forEach(c => {
    const el = cardMap[c.n];
    const isFav = favs.includes(c.n);

    const matchesSearch = c.n.toLowerCase().includes(s);
    const matchesLang = (l === "all" || c.l === l);
    const matchesFav = (!favOnly || isFav);

    const ok = matchesSearch && matchesLang && matchesFav;
    el.style.display = ok ? "" : "none";
    if(ok) visibleCount++;
  });

  let emptyEl = document.getElementById("emptyMsg");
  if(visibleCount === 0){
    if(!emptyEl){
      emptyEl = document.createElement("div");
      emptyEl.id = "emptyMsg";
      emptyEl.className = "empty-msg";
      emptyEl.innerText = "Koi channel nahi mila!";
      grid.appendChild(emptyEl);
    }
  } else if(emptyEl){
    emptyEl.remove();
  }
}

let searchTimer = null;
search.oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 150);
};

lang.onchange = applyFilter;

buildGrid();
</script>
