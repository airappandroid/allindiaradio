<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>All India Radio Stations</title>
  <style>

:root{
  color-scheme:dark;
  --bg:#0b1020;
  --surface:#151c2e;
  --surface-2:#1c263b;
  --border:#2a354b;
  --text-main:#f7f9ff;
  --text-sub:#9ba9bf;
  --accent-cyan:#ff8a4c;
  --fav-active:#ff5470;
  --radius:17px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text-main);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
button,input{font:inherit}
button{touch-action:manipulation}
button:active,.fav-btn:active,.play-btn:active,.retry-btn:active,.state-item:active{filter:none;transform:none;box-shadow:none;opacity:1}
.header-bar{
  position:sticky;top:0;z-index:5;
  margin:-14px -14px 0;padding:14px 14px 12px;
  background:var(--bg);
  border-bottom:1px solid rgba(255,255,255,.045);
}
.filter-row{display:flex;gap:10px;align-items:stretch}
.state-picker-btn,.fav-toggle-btn{
  min-height:48px;border:1px solid var(--border);border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 14px;background:var(--surface);color:var(--text-main);
  font-size:14px;font-weight:700;cursor:pointer;
}
.state-picker-btn{flex:1;min-width:0;text-align:left}
#selectedStateLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-toggle-btn{justify-content:center;white-space:nowrap;color:var(--text-sub)}
.fav-toggle-btn.active{background:#321c2b;border-color:#8d344f;color:#ff6a87}
.meta-bar{padding:15px 3px 12px;color:var(--text-sub);font-size:12px;font-weight:650;letter-spacing:.2px}
.station-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.station-card{
  min-width:0;min-height:124px;padding:13px;
  border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;justify-content:space-between;
  background:var(--surface);cursor:pointer;contain:content;
}
.bg-0{background:#182448;border-color:#2b3d70}
.bg-1{background:#15352f;border-color:#286052}
.bg-2{background:#302044;border-color:#57346f}
.bg-3{background:#15364a;border-color:#285a78}
.bg-4{background:#42243a;border-color:#713b5f}
.bg-5{background:#183b3b;border-color:#2b6863}
.bg-6{background:#462631;border-color:#743c4d}
.bg-7{background:#44331e;border-color:#75542b}
.card-top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.wave-icon{width:21px;height:21px;fill:none;stroke:var(--accent-cyan);stroke-width:2.4;stroke-linecap:round}
.fav-btn{
  width:36px;height:36px;flex:0 0 36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:#101626;
  color:#8491a8;font-size:17px;line-height:1;cursor:pointer;
}
.fav-btn.active{color:var(--fav-active);background:#321c2b;border-color:#713348}
.station-title{margin:3px 0 12px;font-size:14px;font-weight:750;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-bottom-row{display:flex;justify-content:flex-end;align-items:center}
.play-btn{
  width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-cyan);color:#1b1420;font-size:13px;font-weight:900;
}
.status-box{padding:58px 18px;text-align:center;color:var(--text-sub)}
.status-title{margin:0 0 6px;color:var(--text-main);font-size:16px;font-weight:750}
.spinner{width:30px;height:30px;margin:0 auto 14px;border:3px solid var(--border);border-top-color:var(--accent-cyan);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{margin-top:14px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--accent-cyan);color:#1b1420;font-weight:800;cursor:pointer}
.modal-overlay{position:fixed;inset:0;z-index:999;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
.modal-overlay.active{display:flex}
.modal-top-bar{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.modal-close-btn{width:42px;height:42px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text-main);font-size:25px;cursor:pointer}
.modal-search-input{width:calc(100% - 32px);min-height:48px;margin:12px 16px;padding:0 14px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--text-main);font-size:15px;outline:none}
.modal-search-input:focus{border-color:var(--accent-cyan)}
.state-list-scroll{flex:1;overflow-y:auto;padding:0 16px;overscroll-behavior:contain}
.state-item{min-height:54px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.radio-circle{width:19px;height:19px;flex:0 0 19px;border:2px solid #53617a;border-radius:50%}
.state-item.selected .radio-circle{border-color:var(--accent-cyan);background:var(--accent-cyan);box-shadow:inset 0 0 0 4px var(--bg)}
@media(min-width:600px){body{max-width:900px;margin:0 auto;padding-left:20px;padding-right:20px}.header-bar{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}.station-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.station-card{min-height:132px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  </style>
</head>
<body>

  <!-- পুনৰ্ব্যৱহাৰযোগ্য Wave Icon Symbol -->
  <svg style="display: none;">
    <symbol id="icon-wave" viewBox="0 0 24 24">
      <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 11v2"/>
    </symbol>
  </svg>

  <div class="header-bar">
    <div class="filter-row">
      <button class="state-picker-btn" onclick="openStateModal()">
        <span id="selectedStateLabel">Select State</span>
        <span style="font-size: 10px; color: var(--text-sub);">▼</span>
      </button>

      <button id="favFilterBtn" class="fav-toggle-btn" onclick="toggleFavFilter()">
        ♥ Favorites
      </button>
    </div>
  </div>

  <div class="meta-bar">
    <span id="stationCountText">Loading...</span>
  </div>

  <div id="loadingState" class="status-box">
    <div class="spinner"></div>
    <div class="status-title">Loading Stations...</div>
  </div>

  <div id="errorState" class="status-box" style="display: none;">
    <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
    <div class="status-title">Connection Failed</div>
    <button class="retry-btn" onclick="initApp()">Retry</button>
  </div>

  <div id="stationContainer" class="station-grid" style="display: none;"></div>
  
  <div id="emptyMessage" class="status-box" style="display: none;">
    <p id="emptyTitle" class="status-title">Please Select a State</p>
    <p id="emptySub" style="font-size: 13px;">Choose your state to start listening to local stations.</p>
  </div>

  <!-- Modal -->
  <div id="stateModal" class="modal-overlay">
    <div class="modal-top-bar">
      <span style="font-weight: 700;">Select Region / State</span>
      <button class="modal-close-btn" onclick="closeStateModal()">&times;</button>
    </div>
    <input type="search" id="modalStateSearch" class="modal-search-input" placeholder="Search state..." oninput="filterModalStates()">
    <div id="modalStateList" class="state-list-scroll"></div>
  </div>

  <script>
    const DATA_VERSION = "1.0.1";

    // খৰতকীয়া সন্ধানৰ বাবে Set ব্যৱহাৰ
    let favorites = new Set();
    try {
      const saved = localStorage.getItem("air_fav_stations");
      if (saved) favorites = new Set(JSON.parse(saved));
    } catch(e) {}

    let showOnlyFavs = false;
    let selectedState = "";
    try {
      selectedState = localStorage.getItem("air_user_state") || "";
    } catch (e) {
      selectedState = "";
    }
    let stationData = [];
    let uniqueStates = [];
    let isModalOpen = false;

    function saveFavs() {
      try {
        localStorage.setItem("air_fav_stations", JSON.stringify([...favorites]));
      } catch(e) {}
    }

    function fetchStationsData() {
      return new Promise((resolve, reject) => {
        const old = document.getElementById("stationsDataScript");
        if (old) old.remove();

        const s = document.createElement("script");
        s.id = "stationsDataScript";
        s.src = "https://allindiaradio.pages.dev/docs/stations.js?v=2" + DATA_VERSION;
        s.onload = () => {
          const list = window.stations || (typeof stations !== 'undefined' ? stations : null);
          list ? resolve(list) : reject();
        };
        s.onerror = reject;
        document.body.appendChild(s);
      });
    }

    async function initApp() {
      const loader = document.getElementById("loadingState");
      const err = document.getElementById("errorState");
      const grid = document.getElementById("stationContainer");

      loader.style.display = "block";
      err.style.display = "none";
      grid.style.display = "none";

      try {
        const stationList = await fetchStationsData();
        stationData = Array.isArray(stationList) ? stationList : [];
        if (!stationData.length) throw new Error("Station data is empty or invalid");

        loader.style.display = "none";
        grid.style.display = "grid";

        uniqueStates = [...new Set(stationData.map(s => s.state).filter(Boolean))].sort();
        renderModalStateList();

        if (!selectedState) {
          document.getElementById("emptyMessage").style.display = "block";
          document.getElementById("stationCountText").textContent = "No state selected";
          openStateModal();
        } else {
          document.getElementById("selectedStateLabel").textContent = selectedState;
          filterStations();
        }
      } catch(e) {
        loader.style.display = "none";
        err.style.display = "block";
      }
    }

    function renderModalStateList() {
      const listEl = document.getElementById("modalStateList");
      let html = "";
      for (let i = 0; i < uniqueStates.length; i++) {
        const state = uniqueStates[i];
        html += `
          <div class="state-item" data-state="${state}">
            <span>${state}</span>
            <div class="radio-circle"></div>
          </div>`;
      }
      listEl.innerHTML = html;

      listEl.onclick = (e) => {
        const item = e.target.closest(".state-item");
        if (item) selectState(item.dataset.state);
      };
    }

    function openStateModal() {
      if (isModalOpen) return;
      isModalOpen = true;
      history.pushState({ modalOpen: true }, "");

      document.getElementById("modalStateSearch").value = "";
      const items = document.getElementById("modalStateList").children;
      for (let item of items) {
        item.style.display = "flex";
        item.classList.toggle("selected", item.dataset.state === selectedState);
      }
      document.getElementById("stateModal").classList.add("active");
    }

    function closeStateModal(fromPopState = false) {
      if (!isModalOpen) return;
      isModalOpen = false;
      document.getElementById("stateModal").classList.remove("active");
      if (!fromPopState && history.state?.modalOpen) history.back();
    }

    window.addEventListener("popstate", () => {
      if (isModalOpen) closeStateModal(true);
    });

    function selectState(stateName) {
      selectedState = stateName;
      try { localStorage.setItem("air_user_state", stateName); } catch(e) {}
      
      if (showOnlyFavs) {
        showOnlyFavs = false;
        document.getElementById("favFilterBtn").classList.remove("active");
      }
      document.getElementById("selectedStateLabel").textContent = stateName;
      closeStateModal();
      filterStations();
    }

    function filterModalStates() {
      const q = document.getElementById("modalStateSearch").value.toLowerCase().trim();
      const items = document.getElementById("modalStateList").children;
      for (let item of items) {
        item.style.display = !q || item.dataset.state.toLowerCase().includes(q) ? "flex" : "none";
      }
    }

    function renderStations(list) {
      const container = document.getElementById("stationContainer");
      const countLabel = document.getElementById("stationCountText");
      const emptyMsg = document.getElementById("emptyMessage");

      countLabel.textContent = `Showing ${list.length} station(s)`;

      if (list.length === 0) {
        container.innerHTML = "";
        emptyMsg.style.display = "block";
        document.getElementById("emptyTitle").textContent = showOnlyFavs ? "No Favorites Found" : "No Stations Found";
        return;
      }
      emptyMsg.style.display = "none";

      let html = "";
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const isFav = favorites.has(String(s.id));
        html += `
          <div class="station-card bg-${i % 8}" data-id="${s.id}">
            <div class="card-top-row">
              <svg class="wave-icon"><use href="#icon-wave"/></svg>
              <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${s.id}">♥</button>
            </div>
            <div class="station-title">${s.name}</div>
            <div class="card-bottom-row">
              <div class="play-btn">▶</div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    // Event Delegation
    document.getElementById("stationContainer").addEventListener("click", (e) => {
      const favBtn = e.target.closest(".fav-btn");
      if (favBtn) {
        e.stopPropagation();
        const id = String(favBtn.dataset.fav);
        if (favorites.has(id)) {
          favorites.delete(id);
          favBtn.classList.remove("active");
        } else {
          favorites.add(id);
          favBtn.classList.add("active");
        }
        saveFavs();
        if (showOnlyFavs) filterStations(); // কেৱল Fav ভিউত থাকিলেহে ফিল্টাৰ হ'ব
        return;
      }

      const card = e.target.closest(".station-card");
      if (card?.dataset.id) {
        window.location.href = "go:" + card.dataset.id;
      }
    });

    function filterStations() {
      const all = stationData;
      if (!showOnlyFavs && !selectedState) {
        document.getElementById("stationContainer").innerHTML = "";
        document.getElementById("emptyMessage").style.display = "block";
        return;
      }

      const res = all.filter(s => {
        return showOnlyFavs ? favorites.has(String(s.id)) : s.state === selectedState;
      });
      renderStations(res);
    }

    function toggleFavFilter() {
      showOnlyFavs = !showOnlyFavs;
      document.getElementById("favFilterBtn").classList.toggle("active", showOnlyFavs);
      document.getElementById("selectedStateLabel").textContent = showOnlyFavs ? "Favorites" : (selectedState || "Select State");
      filterStations();
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
