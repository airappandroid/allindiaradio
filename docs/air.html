<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All India Radio Stations</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131927;
      --card-border: #1e2638;
      --card-active: #1a2336;
      --text-main: #ffffff;
      --text-sub: #8a99ad;
      --accent-cyan: #00a2ec;
      --accent-green: #22c55e;
      --star-inactive: #94a3b8;
      --star-active: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 60px;
    }

    /* Sticky Header */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(9, 13, 22, 0.96);
      padding-bottom: 12px;
      z-index: 100;
    }

    .search-box-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-sub);
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14.5px;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      outline: none;
    }

    .search-box::placeholder {
      color: #64748b;
    }

    .search-box:focus {
      border-color: var(--accent-cyan);
    }

    .filter-row {
      display: flex;
      gap: 10px;
    }

    .state-picker-btn {
      flex: 1;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .state-picker-btn svg {
      width: 14px;
      height: 14px;
      fill: var(--text-sub);
    }

    .fav-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .fav-toggle-btn.active {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--star-active);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* 3-Column Grid */
    .station-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    /* Card Box */
    .station-card-grid {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      content-visibility: auto;
      contain-intrinsic-size: 0 170px;
      transition: transform 0.15s ease, background-color 0.15s;
    }

    .station-card-grid:active {
      transform: scale(0.96);
      background-color: var(--card-active);
    }

    /* Artwork Container */
    .station-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #0a0f1d;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .station-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .station-fallback-svg {
      width: 34px;
      height: 34px;
      fill: #38bdf8;
      opacity: 0.85;
    }

    /* Floating Badges */
    .status-dot-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      z-index: 2;
    }

    .fav-btn-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(9, 13, 22, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .fav-btn-badge svg {
      width: 13px;
      height: 13px;
      fill: var(--star-inactive);
      transition: fill 0.2s;
    }

    .fav-btn-badge.active svg {
      fill: var(--star-active);
    }

    .station-name-grid {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      height: 30px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
      word-break: break-word;
      text-align: center;
      width: 100%;
      padding: 0 2px;
    }

    .play-circle-grid {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 162, 236, 0.35);
      margin-top: auto;
    }

    .play-circle-grid svg {
      width: 13px;
      height: 13px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
    }

    /* Modal Bottom Sheet - Optimized for Android WebView */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 13, 0.88);
      z-index: 1000;
      display: none;
      justify-content: flex-end;
      flex-direction: column;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: #111726;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--card-border);
      border-bottom: none;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateZ(0);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #334155;
      border-radius: 4px;
      margin: 12px auto 6px auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 18px;
    }

    .modal-header-tag {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-banner {
      text-align: center;
      padding: 10px 20px 14px 20px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-sub);
    }

    .modal-search-wrapper {
      padding: 0 16px 12px 16px;
      position: relative;
    }

    .modal-search-input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .modal-search-input:focus {
      border-color: var(--accent-cyan);
    }

    .modal-search-icon {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-sub);
    }

    .state-list-scroll {
      overflow-y: auto;
      padding: 0 16px 30px 16px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      transform: translateZ(0);
      will-change: scroll-position;
    }

    .state-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
    }

    .state-item:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .state-item.selected .radio-circle {
      border-color: var(--accent-cyan);
    }

    .state-item.selected .radio-circle::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
    }
  </style>
</head>

    // Safe LocalStorage helpers for Android WebView
    function getSafeStorage(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    }

    function setSafeStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    let favorites = getSafeStorage("air_fav_stations", []);
    let showOnlyFavs = false;
    const uniqueStates = [...new Set(stations.map(s => s.state))].sort();
    let selectedState = getSafeStorage("air_user_state", "");

    const defaultIconSvg = `<svg class="station-fallback-svg" viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-.83-.51-1.57-1.24-1.85L12 2.65 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-8v-2h8v2zm0 4h-8v-2h8v2z"/></svg>`;

    function handleImgError(imgElement) {
      imgElement.outerHTML = defaultIconSvg;
    }

    function init() {
      if (!selectedState) {
        openStateModal();
      } else {
        document.getElementById("selectedStateLabel").textContent = selectedState;
      }
      renderModalStates();
      filterStations();
    }

    function openStateModal() {
      document.getElementById("modalStateSearch").value = "";
      renderModalStates();
      document.getElementById("stateModal").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeStateModal() {
      document.getElementById("stateModal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function closeModalOnOutsideClick(e) {
      if (e.target.id === "stateModal") {
        closeStateModal();
      }
    }

    function selectState(stateName) {
      selectedState = stateName;
      setSafeStorage("air_user_state", stateName);
      document.getElementById("selectedStateLabel").textContent = stateName || "All States";
      closeStateModal();
      filterStations();
    }

    // High performance rendering using DocumentFragment
    function renderModalStates(filterText = "") {
      const listEl = document.getElementById("modalStateList");
      listEl.innerHTML = "";

      const fragment = document.createDocumentFragment();

      const allOption = document.createElement("div");
      allOption.className = `state-item ${selectedState === "" ? 'selected' : ''}`;
      allOption.onclick = () => selectState("");
      allOption.innerHTML = `<span>All States (All India)</span><div class="radio-circle"></div>`;
      fragment.appendChild(allOption);

      const lowerFilter = filterText.toLowerCase();
      uniqueStates.forEach(state => {
        if (!filterText || state.toLowerCase().includes(lowerFilter)) {
          const item = document.createElement("div");
          item.className = `state-item ${selectedState === state ? 'selected' : ''}`;
          item.onclick = () => selectState(state);
          item.innerHTML = `<span>${state}</span><div class="radio-circle"></div>`;
          fragment.appendChild(item);
        }
      });

      listEl.appendChild(fragment);
    }

    function filterModalStates() {
      const q = document.getElementById("modalStateSearch").value.trim();
      renderModalStates(q);
    }

    function renderStations(list) {
      const container = document.getElementById("stationContainer");
      const emptyMsg = document.getElementById("emptyMessage");
      const countLabel = document.getElementById("stationCountText");

      countLabel.textContent = `Showing ${list.length} stations`;

      if (list.length === 0) {
        container.innerHTML = "";
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      const html = list.map(station => {
        const isFav = favorites.includes(station.id);
        
        const logoContent = station.logo 
          ? `<img class="station-logo-img" src="${station.logo}" alt="${station.name}" loading="lazy" onerror="handleImgError(this)">` 
          : defaultIconSvg;

        return `
          <div class="station-card-grid" onclick="window.location.href='go:${station.id}'">
            <div class="station-img-wrap">
              ${logoContent}
              <span class="status-dot-badge"></span>
              <button class="fav-btn-badge ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${station.id}')" aria-label="Favorite">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              </button>
            </div>
            
            <div class="station-name-grid" title="${station.name}">${station.name}</div>
            
            <div class="play-circle-grid">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    let searchTimer;
    function handleSearchDebounce() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(filterStations, 100);
    }

    function filterStations() {
      const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = stations.filter(s => {
        const matchesSearch = !searchQuery || s.name.toLowerCase().includes(searchQuery) || s.state.toLowerCase().includes(searchQuery);
        const matchesState = !selectedState || s.state === selectedState;
        const matchesFav = !showOnlyFavs || favorites.includes(s.id);
        return matchesSearch && matchesState && matchesFav;
      });

      renderStations(filtered);
    }

    function toggleFavorite(event, id) {
      event.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      setSafeStorage("air_fav_stations", favorites);
      filterStations();
    }

    function toggleFavFilter() {
      showOnlyFavs = !showOnlyFavs;
      document.getElementById("favFilterBtn").classList.toggle("active", showOnlyFavs);
      filterStations();
    }

    init();
  </script>
