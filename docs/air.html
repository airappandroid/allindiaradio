<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All India Radio</title>

<style>
:root{
  --bg:#0b1020;
  --card:#161d33;
  --glass:rgba(255,255,255,.08);
  --accent:#ff7a45;
  --text:#ffffff;
  --channel:#9fb2ff;
}

/* Disable tap effects */
*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  -webkit-user-select:none;
  user-select:none;
}
input{ user-select:text; -webkit-user-select:text; }

/* ===== STICKY TOP ===== */
.top-fixed{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--bg);
}
.top-fixed::after{
  content:'';
  display:block;
  height:1px;
  background:rgba(255,255,255,.06);
}

header{
  padding:12px 16px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:17px;
  font-weight:600;
}
.favTab{
  color:var(--accent);
  cursor:pointer;
  font-size:14px;
}

/* ===== CONTROLS ===== */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:0 16px 10px;
}
@media(max-width:420px){
  .controls{grid-template-columns:1fr}
}

.search-wrap{position:relative}
.search-wrap input{
  width:100%;
  background:var(--card);
  border:1px solid var(--glass);
  color:var(--text);
  padding:9px 34px 9px 12px;
  border-radius:12px;
  outline:none;
  font-size:14px;
}
.clear-btn{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  color:var(--channel);
  cursor:pointer;
  display:none;
}

.controls select{
  background:var(--card);
  border:1px solid var(--glass);
  color:var(--text);
  padding:9px 12px;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

/* ===== LIST (COMPACT) ===== */
.list{ padding:6px 16px 36px; }

.state{
  margin:14px 0 6px;
  font-size:14px;
  font-weight:600;
  color:var(--accent);
}

.station{
  background:var(--card);
  border:1px solid var(--glass);
  border-radius:14px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}

.play{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--accent);
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  flex-shrink:0;
}

.station-name{
  flex:1;
  font-size:14px;
}

.fav{
  width:30px;
  height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  cursor:pointer;
  background:rgba(255,255,255,.06);
  color:var(--channel);
}
.fav.active{
  background:rgba(255,122,69,.18);
  color:var(--accent);
}

.empty{
  text-align:center;
  color:var(--channel);
  margin-top:36px;
}
</style>
</head>

<body>

<div class="top-fixed">
  <header>
    <span>🎧 AIR Radio</span>
    <span class="favTab" id="favToggle">❤ Favourites</span>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search station or state…">
      <span class="clear-btn" id="clearBtn">✕</span>
    </div>
    <select id="stateFilter">
      <option value="">All States</option>
    </select>
  </div>
</div>

<div class="list" id="stationList"></div>

/* ===== STATE ===== */
let favourites = JSON.parse(localStorage.getItem('airFav')||'[]');
let favMode = false;   // ❗ auto-favourites disabled
let searchTimer = null;

const list = document.getElementById('stationList');
const search = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const filter = document.getElementById('stateFilter');
const favToggle = document.getElementById('favToggle');

/* Populate states */
Object.keys(data).forEach(state=>{
  const o=document.createElement('option');
  o.value=state;
  o.textContent=state;
  filter.appendChild(o);
});

favToggle.onclick=()=>{
  favMode=!favMode;
  favToggle.textContent = favMode ? '← All Stations' : '❤ Favourites';
  render();
};

function render(){
  list.innerHTML='';
  const q = search.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block':'none';

  const stateValue = filter.value;
  let found=false;

  Object.entries(data).forEach(([state,stations])=>{
    if(stateValue && state!==stateValue) return;

    if(q){
      const stateMatch = state.toLowerCase().includes(q);
      const stationMatch = stations.some(st=>st.name.toLowerCase().includes(q));
      if(!stateMatch && !stationMatch) return;
    }

    const visible = stations.filter(
  st => !favMode || favourites.includes(state + "_" + st.id)
);

    if(!visible.length) return;

    found=true;
    const h=document.createElement('div');
    h.className='state';
    h.textContent=state;
    list.appendChild(h);

    visible.forEach(st=>{
      const favKey = state + "_" + st.id;

      const row=document.createElement('div');
      row.className='station';

      const link=document.createElement('a');
      link.href=`go:${st.id}`;
      link.style.display='flex';
      link.style.alignItems='center';
      link.style.gap='12px';
      link.style.flex='1';
      link.style.textDecoration='none';
      link.style.color='inherit';
      link.innerHTML=`<div class="play">▶</div><div class="station-name">${st.name}</div>`;

      const fav=document.createElement('div');
     fav.className='fav'+(favourites.includes(favKey)?' active':'');

      fav.innerHTML='❤';
     fav.onclick = e => {
  e.preventDefault();
  e.stopPropagation();

  favourites = favourites.includes(favKey)
    ? favourites.filter(f => f !== favKey)
    : [...favourites, favKey];

  localStorage.setItem('airFav', JSON.stringify(favourites));
  render();
};


      row.append(link,fav);
      list.appendChild(row);
    });
  });

  if(!found){
    list.innerHTML='<div class="empty">Nothing found</div>';
  }
}

/* Debounced search */
search.oninput=()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(render,300);
};

clearBtn.onclick=()=>{
  search.value='';
  render();
};

filter.onchange=render;
render();
</script>

</body>
</html>
