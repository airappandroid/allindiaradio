<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIR Regional News Bulletins</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090e17;
      color: #e2e8f0;
      padding: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .header-title { font-size: 20px; font-weight: 700; color: #fff; }
    .change-lang-btn {
      background: #131c2b;
      border: 1px solid #1f2d45;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .change-lang-btn:active { background: #1a273c; }
    .bulletin-list { display: flex; flex-direction: column; gap: 12px; }
    .bulletin-card {
      background-color: #131a28;
      border: 1px solid #1e293d;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      content-visibility: auto;
      contain-intrinsic-size: 82px;
      contain: content;
    }
    .bulletin-info { flex: 1; margin-right: 14px; }
    .bulletin-heading { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .bulletin-meta { font-size: 13px; color: #7c8ba1; }
    .lang-badge {
      background-color: #10263f;
      border: 1px solid #1a3c61;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 4px;
    }
    .play-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #0091ff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      border: 0;
      cursor: pointer;
    }
    .play-icon-wrap:active, .play-icon-wrap:focus, .play-icon-wrap:hover {
      background-color: #0091ff;
      transform: none;
      outline: none;
    }
    .play-icon {
      width: 0; height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 11px solid #ffffff;
      margin-left: 2px;
    }
    .empty-msg { display: none; text-align: center; padding: 40px 16px; color: #7c8ba1; font-size: 15px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: #090e17;
      z-index: 9999;
      padding: 16px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #fff; }
    .close-btn {
      background: #131a28;
      border: 1px solid #1e293d;
      color: #fff;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .search-input-box {
      width: 100%;
      background: #131a28;
      border: 1px solid #1e293d;
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    .lang-chip-list {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      overflow-y: auto;
      align-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    .lang-chip {
      background: #131a28;
      border: 1px solid #1e293d;
      color: #cbd5e1;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .lang-chip.is-hidden { display: none !important; }
    .lang-chip.active { background: #0091ff; border-color: #0091ff; color: #fff; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header-wrap">
    <div class="header-title">📻 AIR News</div>
    <button class="change-lang-btn" id="openModalBtn">🌐 <span id="currentLangText">Select Language</span></button>
  </div>

  <div class="bulletin-list" id="bulletinList"></div>
  <div id="emptyMsg" class="empty-msg">No bulletins found.</div>

  <div class="modal-overlay" id="langModal">
    <div class="modal-top">
      <div class="modal-title">Select Language</div>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <input type="text" id="langSearchInput" class="search-input-box" placeholder="Search language..." autocomplete="off">
    <div class="lang-chip-list" id="langChipContainer"></div>
  </div>

  <script>
    // লাইটৱেট ডাটা এৰে (কেৱল প্ৰয়োজনীয় ডাটা ৰখা হৈছে)
    const bulletins = [['Srinagar', 'Kashmiri', '12:35 PM', '22 September 2026', 'MIDDAY-KASHMIRI-1.mp3'], ['Thiruvananthapuram', 'Malayalam', '12:30 PM', '22 September 2026', 'mal-audio-3.mp3'], ['Srinagar', 'Urdu', '12:30 PM', '22 September 2026', 'urdu-audio-4.mp3'], ['Guwahati', 'Assamese', '12:05 PM', '22 September 2026', 'Assamese-Audio-1205-1.mp3'], ['Dharwad', 'Kannada', '12:05 PM', '22 September 2026', 'dwd-audio-1.mp3'], ['Raipur', 'Hindi', '11:55 AM', '22 September 2026', 'raipur1155-1.mp3'], ['C S Nagar', 'Marathi', '11:00 AM', '22 September 2026', 'cs1100-3.mp3'], ['Shimla', 'Hindi', '11:00 AM', '22 September 2026', 'shimla-audio.mp3'], ['Jammu', 'Gojri', '10:15 AM', '22 September 2026', '05-sudio.mp3'], ['Jammu', 'Dogri', '9:45 AM', '22 September 2026', 'dogri-945.mp3'], ['Leh', 'Ladakhi', '9:05 AM', '22 September 2026', 'leh-audio-3.mp3'], ['Jaipur', 'Hindi', '9:00 AM', '22 September 2026', 'Jaipur900-1.mp3'], ['C S Nagar', 'Urdu', '9:00 AM', '22 September 2026', 'c-s-nagar009.mp3'], ['Patna', 'Hindi', '8:48 AM', '22 September 2026', 'patna-audio-1.mp3'], ['Ranchi', 'Hindi', '8:30 AM', '22 September 2026', 'ranchi-audio-3.mp3'], ['Shillong', 'English', '8:30 AM', '22 September 2026', 'Shillong830.mp3'], ['Shillong', 'Khasi', '7:45 AM', '22 September 2026', 'shillong-5.mp3'], ['Agartala', 'Kokborok', '7:40 AM', '22 September 2026', 'Kokborok-10.mp3'], ['Bhuj', 'Gujarati', '7:40 AM', '22 September 2026', 'bhuj-audio-2.mp3'], ['Agartala', 'Bengali', '7:35 AM', '22 September 2026', 'Agartal735.mp3'], ['Kolkata', 'Bengali', '7:35 AM', '22 September 2026', 'kolkata-audio.mp3'], ['Silchar', 'Bengali', '7:35 AM', '22 September 2026', 'sil-audio-2.mp3'], ['Imphal', 'Manipuri', '7:30 AM', '22 September 2026', 'Imphal-730.mp3'], ['Kohima', 'English', '7:30 AM', '22 September 2026', 'kpohima.mp3'], ['Aizawl', 'Mizo', '7:30 AM', '22 September 2026', 'ai-audio-1.mp3'], ['panaji', 'Konkani', '7:25 AM', '22 September 2026', 'Panaji725.mp3'], ['Kohima', 'Nagamese', '7:25 AM', '22 September 2026', 'kohimnagmes.mp3'], ['Kurseong', 'Nepali', '7:25 AM', '22 September 2026', 'KURSEONG-725-2.mp3'], ['Dehradun', 'Hindi', '7:20 AM', '22 September 2026', 'dehradun-5.mp3'], ['Gorakhpur', 'Hindi', '7:20 AM', '22 September 2026', 'gorakpur-3.mp3'], ['Ahmedabad', 'Gujarati', '7:10 AM', '22 September 2026', 'Ahmedabad710.mp3'], ['Bhopal', 'Hindi', '7:10 AM', '22 September 2026', 'bhoapla-udio.mp3'], ['Pune', 'Marathi', '7:10 AM', '22 September 2026', 'pune-15.mp3'], ['Sri Vijaya Puram', 'Hindi', '7:05 AM', '22 September 2026', 'sri-audio.mp3'], ['Cuttack', 'Odia', '7:05 AM', '22 September 2026', 'cuttack-audio.mp3'], ['Sambalpur', 'Sambalpuri', '6:47 AM', '22 September 2026', 'sambhal-2.mp3'], ['Chennai', 'Tamil', '6:45 AM', '22 September 2026', 'Chennai-645.mp3'], ['Calicut', 'Malayalam', '6:45 AM', '22 September 2026', 'Calicut645.mp3'], ['Itanagar', 'English', '19:50', '21 September 2026', 'ita-en-gua-19520.mp3'], ['Itanagar', 'Hindi', '19:45', '21 September 2026', 'ita-hin-aud-1945-2.mp3'], ['Dehradun', 'Kumauni', '19:30', '21 September 2026', 'kuaas-.mp3'], ['Lucknow', 'Hindi', '19:20', '21 September 2026', 'luck-haud0-1920.mp3'], ['Tamil', 'Tamil', '19:15', '21 September 2026', 'Tamil-1915-5.mp3'], ['Mumbai', 'Marathi', '19:00', '21 September 2026', 'mum-aud-10900-1.mp3'], ['Gangtok', 'Bhutia', '18:50', '21 September 2026', 'Bhutia-9.mp3'], ['Dehradun', 'Garhwali', '18:50', '21 September 2026', 'Garwali-1950.mp3'], ['Gangtok', 'Lepcha', '18:45', '21 September 2026', 'lepcha-1.mp3'], ['Bengaluru', 'Kannada', '18:40', '21 September 2026', 'bang-aud-018.mp3'], ['Gangtok', 'Nepali', '18:40', '21 September 2026', 'Gang-Nepali-6.mp3'], ['Shillong', 'Garo', '18:40', '21 September 2026', 'shi-garo-1840.mp3'], ['Patna', 'Maithili', '18:25', '21 September 2026', 'Mathli-4.mp3'], ['Jalandhar', 'Punjabi', '18:20', '21 September 2026', 'Jalandhar-4.mp3'], ['Hyderabad', 'Telugu', '18:10', '21 September 2026', 'hyd-1810-8.mp3'], ['Chandigarh', 'Hindi', '18:10', '21 September 2026', 'chandi-1810-4.mp3'], ['Pudducherry', 'Tamil', '18:10', '21 September 2026', 'pudu-ayd-1810-1.mp3'], ['Raipur', 'Chhattisgarh', '18:10', '21 September 2026', 'Chhattisgari-1810-4.mp3'], ['Visakhapatnam', 'Telugu', '18:10', '21 September 2026', 'Visakhapatnam-9.mp3'], ['Nagpur', 'Marathi', '18:00', '21 September 2026', 'nagpur-8.mp3'], ['Dibrugarh', 'Assamese', '18:00', '21 September 2026', 'asse-ayd-1800.mp3'], ['Gorakhpur', 'Bhojpuri', '18:00', '21 September 2026', 'gorakh-bhoj-1800-5.mp3'], ['Hyderabad', 'Urdu', '17:50', '21 September 2026', 'Hyd-1750-8.mp3'], ['Srinagar', 'Gojri', '17:50', '21 September 2026', 'sri-gojri-1750-4.mp3'], ['Guwahati', 'Bodo', '16:30', '21 September 2026', 'bodo-8.mp3'], ['Srinagar', 'Pahari', '16:20', '21 September 2026', 'Pahari-4.mp3'], ['Guwahati', 'Karbi', '3:45 PM', '21 September 2026', 'karbi-9.mp3'], ['Guwahati', 'Nepali', '3:15 PM', '21 September 2026', 'neali.mp3'], ['Tiruchirapalli', 'Tamil', '1:45 PM', '21 September 2026', 'Trichy-6.mp3'], ['Vijayawada', 'Telugu', '1:20 PM', '21 September 2026', 'Vijayawada-8.mp3'], ['Lucknow', 'Urdu', '1:10 PM', '21 September 2026', 'lko-audio-2.mp3'], ['Jaipur', 'Rajasthani', '6:45 PM', '20 September 2026', 'jai-raj-1845-3.mp3'], ['Shillong', 'Jaintia', '6:40 PM', '20 September 2026', 'jaintia-1.mp3'], ['Ahmedabad', 'Sindhi', '6:15 PM', '20 September 2026', 'Sindhi-1.mp3'], ['Mumbai', 'Lepcha', '5:00 PM', '18 September 2026', 'muuuuu.mp3'], ['Jammu', 'English', '4:55 PM', '17 September 2026', 'ita-eng-2.mp3']];

    const STORAGE_KEY = 'air_selected_lang';
    const baseUrl = 'https://newsonair.gov.in/wp-content/uploads/2026/09/';

    const modal = document.getElementById('langModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const currentLangText = document.getElementById('currentLangText');
    const bulletinList = document.getElementById('bulletinList');
    const emptyMsg = document.getElementById('emptyMsg');
    const langSearchInput = document.getElementById('langSearchInput');
    const langChipContainer = document.getElementById('langChipContainer');

    const uniqueLanguages = [...new Set(bulletins.map(b => b[1]))].sort();

    // কেৱল প্ৰয়োজনীয় কাৰ্ডবোৰ নিমিষতে DOM-ত ইনচাৰ্ট কৰা
    function renderBulletins(lang) {
      currentLangText.textContent = lang || 'Select Language';
      const filtered = lang ? bulletins.filter(b => b[1].toLowerCase() === lang.toLowerCase()) : bulletins;

      if (!filtered.length) {
        bulletinList.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';
      let html = '';
      for (let i = 0; i < filtered.length; i++) {
        const [city, lName, time, date, file] = filtered[i];
        html += `<div class="bulletin-card">
          <div class="bulletin-info">
            <div class="bulletin-heading">${city}</div>
            <div class="bulletin-meta">
              <span class="lang-badge">${lName}</span>
              <div>• ${time} • ${date}</div>
            </div>
          </div>
          <a href="${baseUrl}${file}" class="play-icon-wrap" aria-label="Play ${city} ${lName}"><div class="play-icon"></div></a>
        </div>`;
      }
      bulletinList.innerHTML = html;
    }

    function renderChips() {
      let html = '';
      for (const lang of uniqueLanguages) {
        html += `<button class="lang-chip" data-lang="${lang}">${lang}</button>`;
      }
      langChipContainer.innerHTML = html;
    }

    function setModal(show) {
      modal.classList.toggle('active', show);
      if (show) {
        langSearchInput.value = '';
        filterChips('');
      }
    }

    function filterChips(query) {
      const chips = langChipContainer.children;
      for (let i = 0; i < chips.length; i++) {
        const match = chips[i].dataset.lang.toLowerCase().includes(query);
        chips[i].classList.toggle('is-hidden', !match);
      }
    }

    langChipContainer.addEventListener('click', (e) => {
      const lang = e.target.dataset.lang;
      if (lang) {
        localStorage.setItem(STORAGE_KEY, lang);
        renderBulletins(lang);
        setModal(false);
      }
    });

    langSearchInput.addEventListener('input', (e) => {
      filterChips(e.target.value.toLowerCase().trim());
    });

    openModalBtn.addEventListener('click', () => setModal(true));
    closeModalBtn.addEventListener('click', () => setModal(false));

    renderChips();
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      renderBulletins(saved);
    } else {
      renderBulletins('Assamese');
      setModal(true);
    }
  </script>
</body>
</html>
