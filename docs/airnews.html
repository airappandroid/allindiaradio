<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AIR Regional News</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --play-bg: #2563eb;
      --play-active: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 24px;
    }

    /* Top App Bar Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .header-title svg {
      fill: var(--accent);
      width: 22px;
      height: 22px;
    }

    .lang-btn {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lang-btn:active {
      background: #334155;
    }

    /* Status Bar */
    .status-bar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .current-lang-pill {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Bulletin Cards Container */
    .bulletin-container {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bulletin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
    }

    .bulletin-details {
      flex: 1;
      min-width: 0;
    }

    .bulletin-city {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bulletin-lang {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .bulletin-meta {
      font-size: 0.76rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bulletin-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Play Button */
    .play-btn {
      width: 46px;
      height: 46px;
      background: var(--play-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      flex-shrink: 0;
      transition: transform 0.1s ease, background-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .play-btn.playing {
      background: var(--play-active);
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.4);
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
    }

    .empty-state button {
      margin-top: 14px;
      background: var(--play-bg);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Fullscreen Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-header {
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .modal-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* Search Box */
    .search-box-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box-wrap input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-box-wrap input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-sub);
    }

    /* Languages Grid */
    .lang-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 20px;
    }

    .lang-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      transition: border-color 0.15s ease;
    }

    .lang-item:active {
      background: var(--card-border);
    }

    .lang-item.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
    }
  </style>
</head>

      "Tamil", "Telugu", "Urdu"
    ];

    const STORAGE_KEY = "air_saved_selected_lang";
    const modal = document.getElementById("langModal");
    const langListContainer = document.getElementById("langListContainer");
    const searchInput = document.getElementById("langSearchInput");
    const bulletinList = document.getElementById("bulletinList");
    const emptyView = document.getElementById("emptyView");
    const selectedLangDisplay = document.getElementById("selectedLangDisplay");
    const bulletinCount = document.getElementById("bulletinCount");
    const openModalBtn = document.getElementById("openModalBtn");
    const globalAudio = document.getElementById("globalAudio");

    let currentPlayingBtn = null;

    // Open Modal
    function openModal() {
      modal.classList.remove("hidden");
      searchInput.value = "";
      filterLanguages("");
      searchInput.focus();
    }

    // Close Modal
    function closeModal() {
      modal.classList.add("hidden");
    }

    // Render language buttons in modal
    function renderLanguages(list) {
      const savedLang = localStorage.getItem(STORAGE_KEY) || "All Languages";
      langListContainer.innerHTML = "";
      
      list.forEach(lang => {
        const item = document.createElement("div");
        item.className = `lang-item ${lang.toLowerCase() === savedLang.toLowerCase() ? 'active' : ''}`;
        item.textContent = lang;
        item.onclick = () => selectLanguage(lang);
        langListContainer.appendChild(item);
      });
    }

    // Filter languages with search box
    function filterLanguages(query) {
      const q = query.toLowerCase().trim();
      const filtered = allLanguages.filter(l => l.toLowerCase().includes(q));
      renderLanguages(filtered);
    }

    searchInput.addEventListener("input", (e) => {
      filterLanguages(e.target.value);
    });

    // Select language & save to local storage
    function selectLanguage(lang) {
      localStorage.setItem(STORAGE_KEY, lang);
      closeModal();
      loadBulletins(lang);
    }

    // Load bulletin cards based on language
    function loadBulletins(lang) {
      selectedLangDisplay.textContent = lang;
      
      let filtered = bulletinsData;
      if (lang !== "All Languages") {
        filtered = bulletinsData.filter(b => b.lang.toLowerCase() === lang.toLowerCase());
      }

      bulletinCount.textContent = `${filtered.length} Bulletins`;
      bulletinList.innerHTML = "";

      if (filtered.length === 0) {
        emptyView.style.display = "block";
        return;
      } else {
        emptyView.style.display = "none";
      }

      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.className = "bulletin-card";
        card.innerHTML = `
          <div class="bulletin-details">
            <div class="bulletin-city">${item.city}</div>
            <div class="bulletin-lang">${item.lang} Bulletin</div>
            <div class="bulletin-meta">
              <span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                ${item.time}
              </span>
              <span>•</span>
              <span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                ${item.date}
              </span>
            </div>
          </div>
          <a href="${item.audio}" class="play-btn" data-audio="${item.audio}" aria-label="Play ${item.city} audio">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </a>
        `;
        bulletinList.appendChild(card);
      });

      attachPlayListeners();
    }

    // Audio Play/Pause handling inside app
    function attachPlayListeners() {
      const playBtns = document.querySelectorAll(".play-btn");
      
      playBtns.forEach(btn => {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          const src = this.getAttribute("data-audio");

          if (globalAudio.src === src && !globalAudio.paused) {
            globalAudio.pause();
            updatePlayIcon(this, false);
            currentPlayingBtn = null;
          } else {
            if (currentPlayingBtn) {
              updatePlayIcon(currentPlayingBtn, false);
            }
            globalAudio.src = src;
            globalAudio.play();
            updatePlayIcon(this, true);
            currentPlayingBtn = this;
          }
        });
      });
    }

    function updatePlayIcon(btn, isPlaying) {
      const playIcon = btn.querySelector(".icon-play");
      const pauseIcon = btn.querySelector(".icon-pause");
      if (isPlaying) {
        btn.classList.add("playing");
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
      } else {
        btn.classList.remove("playing");
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
      }
    }

    globalAudio.addEventListener("ended", () => {
      if (currentPlayingBtn) {
        updatePlayIcon(currentPlayingBtn, false);
        currentPlayingBtn = null;
      }
    });

    openModalBtn.addEventListener("click", openModal);

    // Initial load handling
    window.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem(STORAGE_KEY);
      renderLanguages(allLanguages);

      if (savedLang) {
        closeModal();
        loadBulletins(savedLang);
      } else {
        openModal();
      }
    });
  </script>
</body>
</html>
