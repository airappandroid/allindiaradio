<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>All India Radio Stations</title>
  <style>
    :root {
      --bg: #070a12;
      --surface: #111728;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #8292a7;
      --accent-cyan: #00b4d8;
      --fav-active: #ff3366;
      --radius: 14px;
    }

    body {
      margin: 0;
      padding: 14px 14px calc(60px + env(safe-area-inset-bottom)) 14px;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    button, input {
      font-family: inherit;
      box-sizing: border-box;
    }

    .header-bar { padding-bottom: 12px; }
    .filter-row { display: flex; gap: 10px; }

    .state-picker-btn {
      flex: 1;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .fav-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .fav-toggle-btn.active {
      background: rgba(255, 51, 102, 0.12);
      border-color: rgba(255, 51, 102, 0.4);
      color: var(--fav-active);
    }

    .meta-bar {
      padding: 4px 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* Grid layout */
    .station-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .station-card {
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px;
      cursor: pointer;
      contain: content;
    }

    /* Light gradients */
    .bg-0 { background: linear-gradient(145deg, #1e1b4b, #0c0f1d); }
    .bg-1 { background: linear-gradient(145deg, #064e3b, #0c151b); }
    .bg-2 { background: linear-gradient(145deg, #4c1d95, #0e0d1f); }
    .bg-3 { background: linear-gradient(145deg, #0c4a6e, #081622); }
    .bg-4 { background: linear-gradient(145deg, #701a75, #170919); }
    .bg-5 { background: linear-gradient(145deg, #134e4a, #09171b); }
    .bg-6 { background: linear-gradient(145deg, #831843, #190a12); }
    .bg-7 { background: linear-gradient(145deg, #713f12, #16100a); }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .wave-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .fav-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fav-btn.active {
      color: var(--fav-active);
      background: rgba(255, 51, 102, 0.2);
      border-color: rgba(255, 51, 102, 0.4);
    }

    .station-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      margin: 4px 0 8px 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .card-bottom-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }

    .schedule-btn {
      background: rgba(0, 180, 216, 0.16);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: auto;
    }

    .play-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #fff;
    }

    .status-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
    }

    .status-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      margin-top: 14px;
      padding: 10px 20px;
      background: var(--accent-cyan);
      border: none;
      border-radius: 8px;
      color: #070a12;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: none;
      flex-direction: column;
    }

    .modal-overlay.active { display: flex; }

    .modal-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-search-input {
      width: calc(100% - 32px);
      margin: 10px 16px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .state-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .state-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      font-size: 15px;
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #475569;
    }

    .state-item.selected .radio-circle {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- Reusable Wave Icon -->
  <svg style="display: none;">
    <symbol id="icon-wave" viewBox="0 0 24 24">
      <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 11v2"/>
    </symbol>
  </svg>

  <div class="header-bar">
    <div class="filter-row">
      <button class="state-picker-btn" onclick="openStateModal()">
        <span id="selectedStateLabel">Select State</span>
        <span style="font-size: 10px; color: var(--text-sub);">▼</span>
      </button>

      <button id="favFilterBtn" class="fav-toggle-btn" onclick="toggleFavFilter()">
        ♥ Favorites
      </button>
    </div>
  </div>

  <div class="meta-bar">
    <span id="stationCountText">Loading...</span>
  </div>

  <div id="loadingState" class="status-box">
    <div class="spinner"></div>
    <div class="status-title">Loading Stations...</div>
  </div>

  <div id="errorState" class="status-box" style="display: none;">
    <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
    <div class="status-title">Connection Failed</div>
    <button class="retry-btn" onclick="initApp()">Retry</button>
  </div>

  <div id="stationContainer" class="station-grid" style="display: none;"></div>
  
  <div id="emptyMessage" class="status-box" style="display: none;">
    <p id="emptyTitle" class="status-title">Please Select a State</p>
    <p id="emptySub" style="font-size: 13px;">Choose your state to start listening to local stations.</p>
  </div>

  <!-- State Modal -->
  <div id="stateModal" class="modal-overlay">
    <div class="modal-top-bar">
      <span style="font-weight: 700;">Select Region / State</span>
      <button class="modal-close-btn" onclick="closeStateModal()">&times;</button>
    </div>
    <input type="search" id="modalStateSearch" class="modal-search-input" placeholder="Search state..." oninput="filterModalStates()">
    <div id="modalStateList" class="state-list-scroll"></div>
  </div>

  <script>
    const DATA_VERSION = "1.0.1";

    // Quotes আঁতৰোৱাৰ সহায়ক ফাংচন
    function cleanString(val) {
      if (!val) return "";
      let str = String(val).trim();
      try {
        if (str.startsWith('"') && str.endsWith('"')) {
          str = JSON.parse(str);
        }
      } catch(e) {}
      return String(str || "").replace(/^["']|["']$/g, '').trim();
    }

    // Favorites ব্যৱস্থাপনা
    let favorites = new Set();
    try {
      const savedFavs = localStorage.getItem("air_fav_stations");
      if (savedFavs) {
        const parsed = JSON.parse(savedFavs);
        if (Array.isArray(parsed)) {
          favorites = new Set(parsed.map(String));
        }
      }
    } catch(e) {}

    let showOnlyFavs = false;
    let selectedState = cleanString(localStorage.getItem("air_user_state"));
    let uniqueStates = [];
    let isModalOpen = false;

    function saveFavs() {
      try {
        localStorage.setItem("air_fav_stations", JSON.stringify([...favorites]));
      } catch(e) {}
    }

    function fetchStationsData() {
      return new Promise((resolve, reject) => {
        const oldScript = document.getElementById("stationsDataScript");
        if (oldScript) oldScript.remove();

        const script = document.createElement("script");
        script.id = "stationsDataScript";
        script.src = "https://allindiaradio.pages.dev/docs/stations.js?v=" + DATA_VERSION;
        script.onload = () => {
          const list = window.stations || (typeof stations !== 'undefined' ? stations : null);
          list ? resolve(list) : reject(new Error("Empty stations data"));
        };
        script.onerror = () => reject(new Error("Network error"));
        document.body.appendChild(script);
      });
    }

    async function initApp() {
      const loader = document.getElementById("loadingState");
      const err = document.getElementById("errorState");
      const grid = document.getElementById("stationContainer");

      loader.style.display = "block";
      err.style.display = "none";
      grid.style.display = "none";
      document.getElementById("emptyMessage").style.display = "none";

      try {
        const stationList = await fetchStationsData();
        loader.style.display = "none";
        grid.style.display = "grid";

        uniqueStates = [...new Set(stationList.map(s => cleanString(s.state)).filter(Boolean))].sort();
        renderModalStateList();

        if (!selectedState) {
          document.getElementById("emptyMessage").style.display = "block";
          document.getElementById("stationCountText").textContent = "No state selected";
          openStateModal();
        } else {
          document.getElementById("selectedStateLabel").textContent = selectedState;
          filterStations();
        }
      } catch(e) {
        loader.style.display = "none";
        err.style.display = "block";
        document.getElementById("stationCountText").textContent = "Error loading stations";
      }
    }

    function renderModalStateList() {
      const listEl = document.getElementById("modalStateList");
      let html = "";
      for (let i = 0; i < uniqueStates.length; i++) {
        const state = uniqueStates[i];
        html += `
          <div class="state-item" data-state="${state}">
            <span>${state}</span>
            <div class="radio-circle"></div>
          </div>`;
      }
      listEl.innerHTML = html;

      listEl.onclick = (e) => {
        const item = e.target.closest(".state-item");
        if (item) selectState(item.dataset.state);
      };
    }

    function openStateModal() {
      if (isModalOpen) return;
      isModalOpen = true;
      history.pushState({ modalOpen: true }, "");

      document.getElementById("modalStateSearch").value = "";
      const items = document.getElementById("modalStateList").children;
      for (let item of items) {
        item.style.display = "flex";
        item.classList.toggle("selected", item.dataset.state === selectedState);
      }
      document.getElementById("stateModal").classList.add("active");
    }

    function closeStateModal(fromPopState = false) {
      if (!isModalOpen) return;
      isModalOpen = false;
      document.getElementById("stateModal").classList.remove("active");
      if (!fromPopState && history.state?.modalOpen) history.back();
    }

    window.addEventListener("popstate", () => {
      if (isModalOpen) closeStateModal(true);
    });

    function selectState(stateName) {
      selectedState = cleanString(stateName);
      try { 
        localStorage.setItem("air_user_state", selectedState); 
      } catch(e) {}
      
      if (showOnlyFavs) {
        showOnlyFavs = false;
        document.getElementById("favFilterBtn").classList.remove("active");
      }
      document.getElementById("selectedStateLabel").textContent = selectedState || "Select State";
      closeStateModal();
      filterStations();
    }

    function filterModalStates() {
      const q = document.getElementById("modalStateSearch").value.toLowerCase().trim();
      const items = document.getElementById("modalStateList").children;
      for (let item of items) {
        item.style.display = !q || item.dataset.state.toLowerCase().includes(q) ? "flex" : "none";
      }
    }

    function renderStations(list) {
      const container = document.getElementById("stationContainer");
      const countLabel = document.getElementById("stationCountText");
      const emptyMsg = document.getElementById("emptyMessage");

      countLabel.textContent = `Showing ${list.length} station(s)`;

      if (list.length === 0) {
        container.innerHTML = "";
        emptyMsg.style.display = "block";
        document.getElementById("emptyTitle").textContent = showOnlyFavs ? "No Favorites Found" : "No Stations Found";
        return;
      }
      emptyMsg.style.display = "none";

      let html = "";
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const isFav = favorites.has(String(s.id));
        const isMaha = String(s.name || '').toLowerCase().includes("mahabahu");

        html += `
          <div class="station-card bg-${i % 8}" data-id="${s.id}">
            <div class="card-top-row">
              <svg class="wave-icon"><use href="#icon-wave"/></svg>
              <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${s.id}">♥</button>
            </div>
            <div class="station-title">${s.name}</div>
            <div class="card-bottom-row">
              ${isMaha ? `<button class="schedule-btn">Schedule</button>` : ''}
              <div class="play-btn">▶</div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    // Card Event Delegation
    document.getElementById("stationContainer").addEventListener("click", (e) => {
      const favBtn = e.target.closest(".fav-btn");
      if (favBtn) {
        e.stopPropagation();
        const id = String(favBtn.dataset.fav);
        if (favorites.has(id)) {
          favorites.delete(id);
          favBtn.classList.remove("active");
        } else {
          favorites.add(id);
          favBtn.classList.add("active");
        }
        saveFavs();
        if (showOnlyFavs) filterStations();
        return;
      }

      if (e.target.closest(".schedule-btn")) {
        e.stopPropagation();
        window.location.href = "go:mahasc";
        return;
      }

      const card = e.target.closest(".station-card");
      if (card && card.dataset.id) {
        window.location.href = "go:" + card.dataset.id;
      }
    });

    function filterStations() {
      const all = window.stations || (typeof stations !== 'undefined' ? stations : []);
      
      if (!showOnlyFavs && !selectedState) {
        document.getElementById("stationContainer").innerHTML = "";
        document.getElementById("emptyMessage").style.display = "block";
        document.getElementById("stationCountText").textContent = "Please select a state";
        return;
      }

      const res = all.filter(s => {
        const stationState = cleanString(s.state);
        const matchesState = showOnlyFavs ? true : (stationState === selectedState);
        const matchesFav = !showOnlyFavs || favorites.has(String(s.id));
        return matchesState && matchesFav;
      });

      renderStations(res);
    }

    function toggleFavFilter() {
      showOnlyFavs = !showOnlyFavs;
      document.getElementById("favFilterBtn").classList.toggle("active", showOnlyFavs);
      document.getElementById("selectedStateLabel").textContent = showOnlyFavs ? "Favorites" : (selectedState || "Select State");
      filterStations();
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
