<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIR Regional News Bulletins</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090e17;
      color: #e2e8f0;
      padding: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .header-title { font-size: 20px; font-weight: 700; color: #fff; }
    .change-lang-btn {
      background: #131c2b;
      border: 1px solid #1f2d45;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .change-lang-btn:active { background: #1a273c; }
    .bulletin-list { display: flex; flex-direction: column; gap: 12px; }
    .bulletin-card {
      background-color: #131a28;
      border: 1px solid #1e293d;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      touch-action: manipulation;
      content-visibility: auto;
      contain-intrinsic-size: 82px;
      contain: content;
    }
    .bulletin-card:active { background-color: #192336; }
    .bulletin-info { flex: 1; margin-right: 14px; }
    .bulletin-heading { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .bulletin-meta { font-size: 13px; color: #7c8ba1; }
    .lang-badge {
      background-color: #10263f;
      border: 1px solid #1a3c61;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 4px;
    }
    .play-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #0091ff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .play-icon {
      width: 0; height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 11px solid #ffffff;
      margin-left: 2px;
    }
    .empty-msg { display: none; text-align: center; padding: 40px 16px; color: #7c8ba1; font-size: 15px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: #090e17;
      z-index: 9999;
      padding: 16px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-size: 18px; font-weight: 700; color: #fff; }
    .close-btn {
      background: #131a28;
      border: 1px solid #1e293d;
      color: #fff;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .search-input-box {
      width: 100%;
      background: #131a28;
      border: 1px solid #1e293d;
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    .lang-chip-list {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      overflow-y: auto;
      align-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }
    .lang-chip {
      background: #131a28;
      border: 1px solid #1e293d;
      color: #cbd5e1;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .lang-chip.is-hidden { display: none !important; }
    .lang-chip.active { background: #0091ff; border-color: #0091ff; color: #fff; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header-wrap">
    <div class="header-title">📻 AIR News</div>
    <button class="change-lang-btn" id="openModalBtn">🌐 <span id="currentLangText">Select Language</span></button>
  </div>

  <div class="bulletin-list" id="bulletinList"></div>
  <div id="emptyMsg" class="empty-msg">No bulletins found.</div>

  <div class="modal-overlay" id="langModal">
    <div class="modal-top">
      <div class="modal-title">Select Language</div>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <input type="text" id="langSearchInput" class="search-input-box" placeholder="Search language..." autocomplete="off">
    <div class="lang-chip-list" id="langChipContainer"></div>
  </div>

'], ['Shimla', 'Hindi', '15:00', '17 September 2026', 'shimla-17.mp3'], ['Ranchi', 'Hindi', '14:55', '17 September 2026', 'rranchi.mp3'], ['Cuttack', 'Odia', '14:32', '17 September 2026', 'oodia.mp3'], ['Aizawl', 'Mizo', '14:30', '17 September 2026', 'aizwal-13.mp3'], ['Ahmedabad', 'Gujarati', '14:30', '17 September 2026', 'ahem-u-ad-143560.mp3'], ['Bengaluru', 'Kannada', '14:30', '17 September 2026', 'ahem-txt5-1430.mp3'], ['Bhopal', 'Hindi', '14:10', '17 September 2026', 'bho-1410-3.mp3'], ['Tiruchirapalli', 'Tamil', '13:45', '17 September 2026', 'tricy-aytd-1345.mp3'], ['Kolkata', 'Bengali', '13:40', '17 September 2026', 'kolkata-1340-4.mp3'], ['Vijayawada', 'Telugu', '13:20', '17 September 2026', 'Vijayawada-1320-3.mp3'], ['Jalandhar', 'Punjabi', '13:10', '17 September 2026', 'jalan.mp3'], ['Hyderabad', 'Telugu', '13:10', '17 September 2026', 'HYDRABAD1310.mp3'], ['Ranchi', 'Hindi', '13:10', '17 September 2026', 'RANCHI1310.mp3'], ['Lucknow', 'Urdu', '13:10', '17 September 2026', 'Urdu-news1310.mp3'], ['Chandigarh', 'Hindi', '13:10', '17 September 2026', 'CHANDI-13.mp3'], ['Dehradun', 'Hindi', '13:05', '17 September 2026', 'der-1305.mp3'], ['C S Nagar', 'Marathi', '13:00', '17 September 2026', 'c-s-nagar1300-3.mp3'], ['Kolkata', 'Bengali', '12:50', '17 September 2026', 'Bengali-1250.mp3'], ['Srinagar', 'Kashmiri', '12:35', '17 September 2026', 'kashmiri-6.mp3'], ['Thiruvananthapuram', 'Malayalam', '12:30', '17 September 2026', 'TPURAM-1230.mp3'], ['Srinagar', 'Urdu', '12:30', '17 September 2026', 'Urdu1230.mp3'], ['Jammu', 'Dogri', '12:25', '17 September 2026', 'Dogri-4.mp3'], ['Guwahati', 'Assamese', '12:05', '17 September 2026', 'asam-1205-5.mp3'], ['Dharwad', 'Kannada', '12:00', '17 September 2026', 'DHRWAD1200.mp3'], ['Raipur', 'Hindi', '11:55', '17 September 2026', 'raiputr1155.mp3'], ['C S Nagar', 'Marathi', '11:00', '17 September 2026', 'mm-aa-11-1.mp3'], ['Jammu', 'Gojri', '10:15', '17 September 2026', 'GOJRI1015.mp3'], ['Raipur', 'Hindi', '09:55', '17 September 2026', 'raipur0955-2.mp3'], ['Srinagar', 'Urdu', '09:25', '17 September 2026', 'MORNING-URDU-1.mp3'], ['Shimla', 'Hindi', '09:20', '17 September 2026', 'shimla-920.mp3'], ['Srinagar', 'Kashmiri', '09:20', '17 September 2026', 'MORNING-KASHMIRI-NE.mp3'], ['Jammu', 'Dogri', '09:20', '17 September 2026', 'Dogri920.mp3'], ['Leh', 'Ladakhi', '09:05', '17 September 2026', 'lh-0905.mp3'], ['C S Nagar', 'Urdu', '09:00', '17 September 2026', 'c-s-nagar-9.mp3'], ['Guwahati', 'Assamese', '09:00', '17 September 2026', 'Gwwahite.mp3'], ['Jaipur', 'Hindi', '09:00', '17 September 2026', 'JPR-9.mp3']];

    const STORAGE_KEY = 'air_selected_lang';
    const baseUrl = 'https://newsonair.gov.in/wp-content/uploads/2026/09/';

    const modal = document.getElementById('langModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const currentLangText = document.getElementById('currentLangText');
    const bulletinList = document.getElementById('bulletinList');
    const emptyMsg = document.getElementById('emptyMsg');
    const langSearchInput = document.getElementById('langSearchInput');
    const langChipContainer = document.getElementById('langChipContainer');

    const uniqueLanguages = [...new Set(bulletins.map(b => b[1]))].sort();

    // কেৱল প্ৰয়োজনীয় কাৰ্ডবোৰ নিমিষতে DOM-ত ইনচাৰ্ট কৰা
    function renderBulletins(lang) {
      currentLangText.textContent = lang || 'Select Language';
      const filtered = lang ? bulletins.filter(b => b[1].toLowerCase() === lang.toLowerCase()) : bulletins;

      if (!filtered.length) {
        bulletinList.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';
      let html = '';
      for (let i = 0; i < filtered.length; i++) {
        const [city, lName, time, date, file] = filtered[i];
        html += `<a href="${baseUrl}${file}" class="bulletin-card">
          <div class="bulletin-info">
            <div class="bulletin-heading">${city}</div>
            <div class="bulletin-meta">
              <span class="lang-badge">${lName}</span>
              <div>• ${time} • ${date}</div>
            </div>
          </div>
          <div class="play-icon-wrap"><div class="play-icon"></div></div>
        </a>`;
      }
      bulletinList.innerHTML = html;
    }

    function renderChips() {
      let html = '';
      for (const lang of uniqueLanguages) {
        html += `<button class="lang-chip" data-lang="${lang}">${lang}</button>`;
      }
      langChipContainer.innerHTML = html;
    }

    function setModal(show) {
      modal.classList.toggle('active', show);
      if (show) {
        langSearchInput.value = '';
        filterChips('');
      }
    }

    function filterChips(query) {
      const chips = langChipContainer.children;
      for (let i = 0; i < chips.length; i++) {
        const match = chips[i].dataset.lang.toLowerCase().includes(query);
        chips[i].classList.toggle('is-hidden', !match);
      }
    }

    langChipContainer.addEventListener('click', (e) => {
      const lang = e.target.dataset.lang;
      if (lang) {
        localStorage.setItem(STORAGE_KEY, lang);
        renderBulletins(lang);
        setModal(false);
      }
    });

    langSearchInput.addEventListener('input', (e) => {
      filterChips(e.target.value.toLowerCase().trim());
    });

    openModalBtn.addEventListener('click', () => setModal(true));
    closeModalBtn.addEventListener('click', () => setModal(false));

    renderChips();
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      renderBulletins(saved);
    } else {
      renderBulletins('Assamese');
      setModal(true);
    }
  </script>
</body>
</html>
