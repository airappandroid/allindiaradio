<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>📻 Radio Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --accent:#22d3ee;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:radial-gradient(circle at top, #0f172a, #020617);
  color:var(--text);
}

.container{
  max-width:950px;
  margin:auto;
  padding:16px;
}

h1{
  text-align:left;
  font-size:22px;
  margin:4px 0 14px;   /* 👈 niche space */
}


/* 🔍 Controls */
.controls{
  display:flex;
  margin-bottom:22px;
}

.controls input,
.controls select{
  width:100%;
  height:48px;
  padding:0 16px;
  border-radius:16px;
  background:
    linear-gradient(180deg,
      rgba(34,211,238,.18),
      rgba(255,255,255,.08)
    );
  border:1.5px solid #22d3ee;
  color:#ffffff;
  font-size:14px;
  font-weight:600;
  outline:none;
  backdrop-filter:blur(14px);
  box-shadow:
    0 0 0 1px rgba(34,211,238,.35),
    0 8px 24px rgba(34,211,238,.15);
}


/* placeholder */
.controls input::placeholder{
  color:#9ca3af;
}

/* 🔽 dropdown fix */
.controls select{
  appearance:none;
  background-image:
    linear-gradient(45deg, transparent 50%, #ffffff 50%),
    linear-gradient(135deg, #ffffff 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 20px,
    calc(100% - 12px) 20px;
  background-size:6px 6px;
  background-repeat:no-repeat;
}

/* dropdown options */
.controls select option{
  background:#020617;
  color:#ffffff;
}
/* focus */
.controls input:focus,
.controls select:focus{
  border-color:#22d3ee;
  box-shadow:0 0 0 2px rgba(34,211,238,.25);
}

.controls select:hover{
  box-shadow:
    0 0 0 2px rgba(34,211,238,.45),
    0 10px 30px rgba(34,211,238,.25);
}
.controls select:focus{
  box-shadow:
    0 0 0 3px rgba(34,211,238,.55),
    0 12px 34px rgba(34,211,238,.35);
}
/* 📻 Channel Card */
.channel{
  margin-bottom:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  backdrop-filter:blur(14px);
}

.channel-title{
  padding:14px 16px;
  font-size:17px;
  font-weight:700;
  color:var(--accent);
  border-bottom:1px solid var(--border);
}

.schedule-item{
  display:flex;
  gap:14px;
  padding:12px 16px;
  border-bottom:1px dashed rgba(255,255,255,.08);
}

.schedule-item:last-child{
  border-bottom:none;
}

.time{
  min-width:74px;
  font-weight:700;
  font-size:13px;
  color:#38bdf8;
}

.title{
  font-size:14px;
  line-height:1.4;
}

/* empty */
.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="container">
  <h1 id="todayDate"></h1>


  <!-- 🔍 Filter Bar -->
  <div class="controls">
  <select id="channelFilter">
    <option value="all">All Channels</option>
  </select>
</div>


  <div id="schedule"></div>
</div>

<script src="https://airappandroid.github.io/allindiaradio/schedule.js"></script>

<script>
const scheduleEl = document.getElementById("schedule");

const channelFilter = document.getElementById("channelFilter");

const data = window.SCHEDULE_DATA;

// unique channels
const channels = [...new Set(data.map(d => d.channel))];
channels.forEach(c=>{
  const opt = document.createElement("option");
  opt.value = c;
  opt.textContent = c;
  channelFilter.appendChild(opt);
});

function render(){
  const selected = channelFilter.value;
  scheduleEl.innerHTML = "";

  const now = new Date();

  // current time → minutes
  let currentMinutes = now.getHours() * 60 + now.getMinutes();

  // agar minute > 0 ho → next full hour se dikhaye
  if (now.getMinutes() > 0) {
    currentMinutes = (now.getHours() + 1) * 60;
  }

  function timeToMinutes(t){
    const [time, meridian] = t.split(" ");
    let [h, m] = time.split(":").map(Number);

    if (meridian === "PM" && h !== 12) h += 12;
    if (meridian === "AM" && h === 12) h = 0;

    return h * 60 + m;
  }

  // channel filter
  const channelFiltered = data.filter(item =>
    selected === "all" || item.channel === selected
  );

  // upcoming programmes (today)
  let upcoming = channelFiltered.filter(item =>
    timeToMinutes(item.time) >= currentMinutes
  );

  // 🔄 agar aaj kuch bhi upcoming nahi mila
  // to automatically next cycle (00:00 AM se)
  if (upcoming.length === 0) {
    upcoming = channelFiltered;
  }

  const grouped = {};
  upcoming.forEach(i=>{
    if(!grouped[i.channel]) grouped[i.channel] = [];
    grouped[i.channel].push(i);
  });

  Object.keys(grouped).forEach(channel=>{
    const div = document.createElement("div");
    div.className = "channel";
    div.innerHTML = `
      <div class="channel-title">${channel}</div>
      ${grouped[channel].map(p=>`
        <div class="schedule-item">
          <div class="time">${p.time}</div>
          <div class="title">${p.title}</div>
        </div>
      `).join("")}
    `;
    scheduleEl.appendChild(div);
  });
}

channelFilter.addEventListener("change", render);

render();
const todayDateEl = document.getElementById("todayDate");

const today = new Date();
const options = {
  weekday: "long",
  day: "numeric",
  month: "long",
  year: "numeric"
};

todayDateEl.textContent =
  "📻 " + today.toLocaleDateString("en-GB", options);


</script>

</body>
</html>
