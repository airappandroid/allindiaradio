<style>
:root{
  --bg:#0b1020;
  --card:#161d33;
  --glass:rgba(255,255,255,.07);
  --green:#4cd964;
  --text:#ffffff;
  --channel:#9fb2ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  padding:14px;
  text-align:center;
  font-weight:700;
  background:var(--card);
}

/* FILTER */
.filters{
  padding:10px;
}

.filters select{
  width:100%;
  background:var(--card);
  border:1px solid var(--glass);
  color:var(--text);
  padding:10px;
  border-radius:10px;
}

/* TABLE */
.table{
  margin:10px;
  border-radius:14px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:70px 1fr 120px;
  padding:10px;
  background:var(--card);
  border-bottom:1px solid var(--glass);
  font-size:12px;
}

.row.head{
  background:#1d2542;
  font-weight:700;
  color:#c7d2fe;
}

.time{
  color:var(--green);
  font-weight:600;
}

.channel{
  color:var(--channel);
  font-size:12px;
}
</style>
</head>

  o.value = c;
  o.textContent = c;
  channelFilter.appendChild(o);
});

// RENDER
function render(){
  table.querySelectorAll(".row:not(.head)").forEach(r=>r.remove());

  const ch = channelFilter.value;

  SCHEDULE
    .filter(s => !ch || s.channel === ch)
    .forEach(s=>{
      table.innerHTML += `
        <div class="row">
          <div class="time">${s.time}</div>
          <div>${s.title}</div>
          <div class="channel">${s.channel}</div>
        </div>`;
    });
}
