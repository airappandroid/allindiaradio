<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>📻 Radio Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== ROOT COLORS (DO NOT CHANGE) ===== */
:root{
  --page-bg: #020617;      /* 🔒 same as before */
  --time-color: #38bdf8;   /* 🔒 same as before */
  --text-color: #e5e7eb;
  --border-color: rgba(255,255,255,.15);
}

/* ===== BASE ===== */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--page-bg);
  color: var(--text-color);
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* ===== DATE / TITLE ===== */
h1{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

/* ===== FILTER ===== */
.controls{
  margin-bottom:16px;
}

.controls select{
  width:100%;
  height:42px;
  padding:0 12px;
  font-size:14px;
  border-radius:6px;
  border:1px solid var(--border-color);
  background:rgba(255,255,255,.06);
  color:var(--text-color);
}

.controls select option{
  background: var(--page-bg);
  color: var(--text-color);
}

/* ===== CHANNEL BLOCK ===== */
.channel{
  border:1px solid var(--border-color);
  border-radius:6px;
  margin-bottom:18px;
  overflow:hidden;
}

.channel-title{
  padding:10px 12px;
  font-weight:700;
  font-size:15px;
  text-align:center;
  border-bottom:1px solid var(--border-color);
}

/* boxed channel label */
.channel-title span{
  display:inline-block;
  padding:4px 14px;
  border:1px solid var(--time-color);
  border-radius:16px;
  color:var(--time-color);
}


/* ===== SCHEDULE ROWS ===== */
.schedule-item{
  display:flex;
  gap:12px;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.schedule-item:last-child{
  border-bottom:none;
}

/* 🔒 time color locked */
.time{
  min-width:70px;
  font-weight:700;
  font-size:13px;
  color: var(--time-color);
}

/* title */
.title{
  font-size:13px;
  line-height:1.4;
}

</style>
</head>

<body>

<div class="container">
  <h1 id="todayDate"></h1>


  <!-- 🔍 Filter Bar -->
  <div class="controls">
  <select id="channelFilter">
    <option value="all">All Channels</option>
  </select>
</div>


  <div id="schedule"></div>
</div>

<script src="https://airappandroid.github.io/allindiaradio/schedule.js"></script>

<script>
const scheduleEl = document.getElementById("schedule");

const channelFilter = document.getElementById("channelFilter");

const data = window.SCHEDULE_DATA;

// unique channels
const channels = [...new Set(data.map(d => d.channel))];
channels.forEach(c=>{
  const opt = document.createElement("option");
  opt.value = c;
  opt.textContent = c;
  channelFilter.appendChild(opt);
});

function render(){
  const selected = channelFilter.value;
  scheduleEl.innerHTML = "";

  const now = new Date();

  // start time → next full hour
  let startMinutes = now.getHours() * 60 + now.getMinutes();
  if (now.getMinutes() > 0) {
    startMinutes = (now.getHours() + 1) * 60;
  }

  // ⏰ sirf next 5 hours
  const endMinutes = startMinutes + (5 * 60);

  function timeToMinutes(t){
    const [time, meridian] = t.split(" ");
    let [h, m] = time.split(":").map(Number);

    if (meridian === "PM" && h !== 12) h += 12;
    if (meridian === "AM" && h === 12) h = 0;

    return h * 60 + m;
  }

  const channelFiltered = data.filter(item =>
    selected === "all" || item.channel === selected
  );

  let windowed = channelFiltered.filter(item => {
    const mins = timeToMinutes(item.time);
    return mins >= startMinutes && mins < endMinutes;
  });

  // agar aaj ke window me kuch nahi mila
  // to next cycle (12 AM – 4:59 AM)
  if (windowed.length === 0) {
    windowed = channelFiltered.filter(item => {
      const mins = timeToMinutes(item.time);
      return mins < (5 * 60);
    });
  }

  const grouped = {};
  windowed.forEach(i=>{
    if(!grouped[i.channel]) grouped[i.channel] = [];
    grouped[i.channel].push(i);
  });

  Object.keys(grouped).forEach(channel=>{
    const div = document.createElement("div");
    div.className = "channel";
    div.innerHTML = `
      <div class="channel-title"><span>${channel}</span></div>
      ${grouped[channel].map(p=>`
        <div class="schedule-item">
          <div class="time">${p.time}</div>
          <div class="title">${p.title}</div>
        </div>
      `).join("")}
    `;
    scheduleEl.appendChild(div);
  });
}

channelFilter.addEventListener("change", render);

render();
const todayDateEl = document.getElementById("todayDate");

const today = new Date();
const options = {
  weekday: "long",
  day: "numeric",
  month: "long",
  year: "numeric"
};

todayDateEl.textContent =
  "📻 " + today.toLocaleDateString("en-GB", options);


</script>

</body>
</html>
