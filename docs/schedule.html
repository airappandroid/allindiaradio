<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIR Cuesheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b1020;
  --card:#161d33;
  --glass:rgba(255,255,255,.07);
  --accent:#ff7a45;
  --green:#4cd964;
  --text:#ffffff;
  --channel:#9fb2ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  padding:14px;
  text-align:center;
  font-weight:700;
  background:var(--card);
}


/* TABLE */
.table{
  margin:10px;
  border-radius:14px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:70px 1fr 120px; /* Time | Program | Channel */
  padding:10px;
  background:var(--card);
  border-bottom:1px solid var(--glass);
  font-size:12px;
}

.row.head{
  background:#1d2542;
  font-weight:700;
  color:#c7d2fe;
}

.time{
  color:var(--green);
  font-weight:600;
}

.channel{
  color:var(--channel);
  font-size:12px;
}
</style>
</head>

<body>

<div class="header" id="todayDate"></div>



<div class="table" id="table">
  <div class="row head">
    <div>Time</div>
    <div>Program</div>
    <div>Channel</div>
